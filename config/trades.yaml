            entry_date: 2022-05-20
            exit_date: 2022-05-24                # lifted the day the domestic sale is contracted
            exit_reason: UNWIND
      fx_forwards:
        hedge_frac_target: 1.0
        lines:
          - fwd_id: T04-FX-1
            booking_date: 2022-04-27                # dealt on the L1 B/L: the payment date exists only then
            direction: BUY_USD
            notional_usd: 1518300.0
            value_date: 2022-05-04                # L1 B/L + 7 days
            matched_leg: PURCHASE_INVOICE
          - fwd_id: T04-FX-2
            booking_date: 2022-05-04
            direction: BUY_USD
            notional_usd: 1518300.0
            value_date: 2022-05-11                # L2 B/L + 7 days
            matched_leg: PURCHASE_INVOICE
          - fwd_id: T04-FX-3
            booking_date: 2022-04-14
            direction: BUY_USD
            notional_usd: 120300.0
            value_date: 2022-05-04                # freight prepaid at shipment
            matched_leg: FREIGHT

    rationale:
      parity_week_end: 2022-04-01
      cited_columns: [net_arb_inr_t, net_arb_pit_mix_inr_t, net_arb_conv18k_inr_t, grade_factor,

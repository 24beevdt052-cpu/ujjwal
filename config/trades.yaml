        a fortnight without conviction and USD/INR is grinding up. I take a small parcel, 60 boxes, from the
        Delaware yard because it is 13 dollars under my own netback and because I want a second US supplier on
        the book before the good one prices me out. Freight is the quiet win on this lane: the index has come
        off 12 % since the 04-Mar week and I book it on the stop's last date rather than the first. The
        decision I want on the record is the hedge. I am selling 87 lots, not the 157 the desk rule would give
        me — half the length, not ninety per cent — for two reasons. The March margin call on the short book

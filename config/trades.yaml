          window_end: 2022-07-08
          factor_frac: 0.916
          premium_inr_t: -41200.0
          terms_basis_note: >-
            0.916 x the MCX near-month average over the eight trading days to 08-Jul-2022, less 41,200 ₹/MT. On
            21-Apr-2022 levels (M2 270.248 ₹/kg on this lane) that prices the cargo at 206,347 ₹/MT, against an
            import replacement value of 184,281 and a netback of 228,459 — the desk's half-the-gap rule,
            206,370, rounded through the premium.
        payment:
          terms: CREDIT
          credit_days: 30

    hedges:
      mcx:
        hedge_ratio_target: 1.0
        exposure_basis: NET_LME_EQ_DELTA
        basis_risk_note: >-
          Two floating legs against two exchanges: the purchase on the LME official cash average of the month
          after shipment, the sale on the MCX near-month average over eight days at the turn of June and July.
          Because the sale's recovery factor grossed up by duty parity (0.916 x 1.0825 = 0.99) is larger than

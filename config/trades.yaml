# ACADEMIC SIMULATION — not actual trades.
#
# The authoritative Phase 2 trade book: nine purchase SPAs, March–August 2022 (MASTER_SPEC Table 4, CONTRACTS §6).
# Counterparties live in `config/counterparties.yaml`; the engine fixture (three tickets, deliberately disjoint
# from this book) is `config/trades.example.yaml`.
#
# WHAT IS REAL AND WHAT IS NOT
#   * Real (DIRECT): every date is an LME trading day from the Phase 0 panel; LME cash and 3M, the customs
#     notified FX path, duty rates, MCX contract months and expiries, the 27-Jul-2022 void calls at Nhava
#     Sheva/Mundra cited in T07.
#   * PROXY: USD/INR and its forwards, the MCX price series (duty-paid import parity), the freight index shape.
#   * ASSUMPTION: grade factors (a lag-2 reconstruction), freight levels, the fixture spread over the index,
#     payloads, transit and clearance days, and every desk policy number in docs/20_trade_book.md §6.
#   * SIM: counterparties, vessels, voyages, forwarders, banks, SPA references, survey outcomes, the arrival
#     delays and dwell days attributed to the void calls and to the radiation referral, and the buyer payment
#     delay.
#
# NO HINDSIGHT IN A DECISION — but the inputs are not all point-in-time. Every price, factor, fixture and hedge
# size in a ticket is set from information *dated* on or before the day it is typed against, and
# `desk.book.validate` re-derives each one point-in-time and refuses the book if it cannot. Two of those inputs
# were nevertheless PUBLISHED later and are reconstructions: the grade factors (a lag-2 unit-value mix) and the
# lane freight levels (level inputs public from 2022-09-30, CONTRACTS §4.3). No ticket may claim otherwise —
# desk.book.validate P13 refuses a note that asserts its inputs were all knowable on the day. Rationales may cite
# dated market facts only up to their own trade date, and the numbers in them are reconciled to the panel (P13). Numbers the engine derives — box counts, quotational-period dates, MCX fill
# and settlement prices, forward strikes, the freight index at fixture, invoice values, every cashflow date —
# are rejected by the loader if they appear here, and are written instead to outputs/tables/.
#
# TRADE DISCIPLINE (Table 4 row 2.9, CONTRACTS §5a). All nine trade dates fall in week × grade × lane cases that
# are open under ALL THREE screens — base, point-in-time grade mix, and conversion stressed to ₹18,000/t of ingot.
# `outputs/tables/trade_eligibility_check.csv` carries the parity numbers each decision was taken against. The
# three screens are NOT independent: two of them run on the same lag-2 reconstructed grade mix, and the stressed
# one binds alone (docs/20_trade_book.md §3). The rule is fixed by §5a and stays; the claim about it does not.
#
# COVERAGE (Table 4)
#   incoterm .......... FOB T01 T04 T07        | CFR T02 T03 T05 T06 T08 T09
#   purchase pricing .. FIXED T01 T03 T04 T06 T07 T09 | LME M+1 cash average T02 T05 T08
#   import payment .... LC sight T01 T03 T04 T06 T07 T08 | LC usance 90d T02, 60d T05 T09
#   sale pricing ...... FIXED ₹/t T01 T03 T04 T06 T07 T09 | MCX near-month average T02 T05 T08
#   sale payment ...... advance T01-S2 | advance+credit T01-S1 T04 T07 T09 | 30d credit T02 T03 T05 T08 | 45d T06
#   hedge ............. MCX short 8 tickets, MCX long T02 | 25 tranches, 13 rolls | USD/INR forwards on all nine
#   freight layer ..... unbooked FOB under a stated stop-loss T01 T04 T07 | inside the CFR price elsewhere
#   events ............ quality outside franchise T07, radiation-portal rejection T08, void-call arrival delay
#                       T08 (boxes still afloat) and landside dwell T07 (boxes already landed), AERB/Customs
#                       referral dwell T08, buyer payment delay T07

schema_version: 1

trades:

  # ================================================================================================== T01
  # Fixed-price FOB Zorba out of Norfolk bought the morning after the 07-Mar all-time high broke. Three sailings,
  # freight left open under a stop-loss, sold in two parcels seven and nine weeks later — so the cargo marks at
  # import replacement value for most of its life and the grade-factor bucket is live the whole time.
  - trade_id: T01
    status: EXECUTED
    trade_date: 2022-03-08
    lane: USEC_MUN
    grade: zorba
    quantity_mt: 2520.0                        # 120 x 40ft at container_payload_mt_40ft_zorba = 21.0 MT

    purchase:
      supplier_id: SUP_USEC_01
      spa_ref: "SPA/USEC/2203-01 (SIM)"
      incoterm: FOB
      named_place: "FOB Norfolk, VA, USA"
      spa:
        isri_grade_spec: "Zorba 95/5, ISRI Scrap Specifications Circular 2022"
        quantity_tolerance_frac: 0.05          # LC sizing only; the B/L weight is the nominal payload
      pricing:
        type: FIXED
        price_usd_t: 2340.0
        terms_basis_note: >-
          CFR-India parity on 08-Mar-2022 = LME 3M 3,516.0 x grade_factor_zorba 0.699250 = 2,458.56 USD/t; less
          the USEC_MUN freight of 106.41 USD/t at the 21.0 t 40ft payload gives an FOB netback of 2,352.15 USD/t.
          Bid 2,340.00 FOB, 12.15 USD/t under netback, on the day the market broke 12 % — the seller wanted a
          price before the LME reopened properly and the desk wanted the discount for taking it. Provenance, so
          the reader is not misled: LME 3M is DIRECT and dated 08-Mar-2022, but the grade factor is a lag-2
          reconstruction and the USEC_MUN freight level subtracted to get this netback is an ASSUMPTION whose own
          level inputs were published months after this week (CONTRACTS §4.3). The netback is therefore not a
          price the desk could have computed on the day, and the 12.15 USD/t is measured against it.
      payment:
        instrument: LC_SIGHT
        lc_open_date: 2022-03-14
        issuing_bank: "Bharat Mercantile Bank Ltd (SIM)"
        confirmed: true                        # SUP_USEC_01 will not ship against an unconfirmed instrument
        confirmation_charges_for: APPLICANT

    shipment:
      laycan_start: 2022-03-28
      laycan_end: 2022-04-08
      load_port: "Norfolk, VA, USA"
      discharge_port: MUNDRA
      lots:
        - lot_id: L1
          boxes: 40
          bl_date: 2022-03-29
          vessel: "MV Norfolk Pioneer (SIM)"
          voyage: "118E (SIM)"
        - lot_id: L2
          boxes: 40
          bl_date: 2022-04-04
          vessel: "MV Chesapeake Runner (SIM)"
          voyage: "120E (SIM)"
        - lot_id: L3
          boxes: 40
          bl_date: 2022-04-07
          vessel: "MV Carolina Star (SIM)"
          voyage: "122E (SIM)"

    freight:
      booked_by: DESK_NVOCC
      forwarder: "Meridian Box Lines NVOCC (SIM)"
      payment_terms: COLLECT_AT_ARRIVAL
      risk_layer: UNHEDGED_STOP_LOSS
      fixture_date: 2022-03-18
      rate_usd_box: 2170.0
      stop_loss:
        stop_loss_usd_box: 2570.0
        latest_fixture_date: 2022-03-18
        note: >-
          No India-lane container derivative was accessible to this desk in 2022, so the freight layer is a
          policy rather than an instrument: stay unbooked while the lane index is falling, but fix at once if it
          reaches 2,570 USD/FEU (the 08-Mar index of 2,234.61 USD/FEU plus the desk's 15 % stop), and in any case
          by the book-by date, which is the NVOCC's ten-day space-confirmation lead time before the first B/L.
          The index fell through the window instead and the desk fixed on the stop's last day at 2,170 USD/FEU
          against an index of 2,127.09. Whether the stop was ever touched is re-derived point-in-time from the
          panel freight column by desk.book.validate.

    sales:
      - sale_id: S1
        buyer_id: BUY_MUN_01
        contract_date: 2022-04-25
        lot_ids: [L1, L2]
        delivery_basis: "FOR buyer's works, Gandhidham (SIM)"
        pricing:
          type: FIXED
          price_inr_t: 201000.0
          terms_basis_note: >-
            Priced on 25-Apr-2022 between the two bounds the desk can defend: import replacement value
            189,814 ₹/MT and the MCX-anchored smelter netback 213,870 ₹/MT. The desk's standing rule is to split
            that gap in half — 201,842 ₹/MT — and then to price the payment terms at the desk's own cost of
            money rather than at a round number: a 50 % advance paid before release is worth
            201,842 x 9.60 % x 15/365 = 796 ₹/MT, and the buyer keeps it. 201,046 ₹/MT, contracted at 201,000.
            Nobody quoted this price; it is a stated rule applied to the desk's own two bounds.
        payment:
          terms: ADVANCE_PLUS_CREDIT
          advance_frac: 0.50
          advance_date: 2022-05-20
          credit_days: 30
      - sale_id: S2
        buyer_id: BUY_RJK_01
        contract_date: 2022-05-09
        lot_ids: [L3]
        delivery_basis: "FOR buyer's works, Rajkot (SIM)"
        pricing:
          type: FIXED
          price_inr_t: 180500.0
          terms_basis_note: >-
            Priced on 09-May-2022 between a replacement value of 176,081 ₹/MT and a netback of 187,981 ₹/MT;
            half the gap is 182,031 ₹/MT, and payment in full before release is worth
            182,031 x 9.60 % x 30/365 = 1,436 ₹/MT of the desk's own working-capital cost, which the buyer
            keeps. 180,595 ₹/MT, contracted at 180,500. The last parcel went 20,500 ₹/MT below the first
            because the LME lost another 11 % in the fortnight — which is the whole argument for having
            hedged it.
        payment:
          terms: ADVANCE
          advance_frac: 1.0
          advance_date: 2022-05-24

    hedges:
      mcx:
        hedge_ratio_target: 0.90
        exposure_basis: NET_LME_EQ_DELTA
        basis_risk_note: >-
          MCX Aluminium is a primary-ingot contract priced at duty-paid import parity; the desk is long Zorba
          95/5 scrap whose CFR price is a reconstructed percentage of LME 3M. The hedge covers the LME leg of
          the exposure and nothing else: if the Zorba discount narrows or widens, that lands in the grade-spread
          bucket, not in the hedge, and on this ticket it is the larger number of the two. Three further
          mismatches are carried knowingly — LME official cash is fixed at the London midday ring while MCX
          settles in the Indian evening; the duty-parity relationship can break, as it visibly did in the first
          week of March 2022; and the physical cargo's duty base runs on the CBIC notified rate while MCX's
          uplift runs on the market rate. In base runs the panel MCX series is itself a parity proxy, so the
          measured cross-exchange basis is zero by construction and only the third-party mirror run shows it.
          The line is split 200/100 lots from the outset because the cargo is expected to be sold in two
          parcels, and a tranche is lifted as each sale fixes its price. The hedge goes on the day AFTER the
          trade: the near-month PROXY moved 12.0 % on the trade date, past the 9 % maximum daily price limit
          (mcx_al_dpl_max_frac), so a real contract would have traded at the limit if it traded at all, and a
          seller finds no bid in a limit-down market — an inference from the proxy, not an MCX print. The
          desk carries one session of the cargo unhedged and says so rather than claiming a fill it could not
          have had. Two honest qualifications on that. The panel's MCX series is a computed import-parity proxy
          with no price limits in it at all — it prints the whole move on the trade date — so the limit is a
          constraint the desk imposes on the proxy, not one the series contains. And waiting a session is not a
          cost by construction: on a genuinely limit-locked contract the next session gaps down to catch up the
          unprinted move, which would have made this short worse, while against a proxy that has already printed
          it the delayed fill lands above. Which way it went here is derived, not typed: see
          docs/20_trade_book.md §6.1. One more artefact to name, because this line rolls: the panel's M1 and M2
          are built from one spot by a deterministic interest carry, so the curve is in contango by construction
          and every roll of a short in this book shows a gain; the real contract can and does go into
          backwardation, when the metal part of the same roll costs money.
        tranches:
          - hedge_id: T01-MCX-1
            contract_month: "2022-04"
            direction: SELL
            lots: 200
            entry_date: 2022-03-09                # the 08-Mar session was beyond the daily price limit
            exit_date: 2022-04-20                # 7 trading days before the 29-Apr expiry
            exit_reason: ROLL
            roll_to: T01-MCX-3
          - hedge_id: T01-MCX-2
            contract_month: "2022-04"
            direction: SELL
            lots: 100
            entry_date: 2022-03-09
            exit_date: 2022-04-20
            exit_reason: ROLL
            roll_to: T01-MCX-4
          - hedge_id: T01-MCX-3
            contract_month: "2022-05"
            direction: SELL
            lots: 200
            entry_date: 2022-04-20
            exit_date: 2022-04-25                # lifted the day S1 fixes its rupee price
            exit_reason: UNWIND
          - hedge_id: T01-MCX-4
            contract_month: "2022-05"
            direction: SELL
            lots: 100
            entry_date: 2022-04-20
            exit_date: 2022-05-09                # lifted the day S2 fixes its rupee price
            exit_reason: UNWIND
      fx_forwards:
        hedge_frac_target: 1.0
        lines:
          - fwd_id: T01-FX-1
            booking_date: 2022-03-29                # dealt on the L1 B/L, which is the day the payment date exists
            direction: BUY_USD
            notional_usd: 1965600.0
            value_date: 2022-04-05                # L1 B/L + 7 days: sight payment against documents
            matched_leg: PURCHASE_INVOICE
          - fwd_id: T01-FX-2
            booking_date: 2022-04-04
            direction: BUY_USD
            notional_usd: 1965600.0
            value_date: 2022-04-11
            matched_leg: PURCHASE_INVOICE
          - fwd_id: T01-FX-3
            booking_date: 2022-04-07
            direction: BUY_USD
            notional_usd: 1965600.0
            value_date: 2022-04-14
            matched_leg: PURCHASE_INVOICE
          - fwd_id: T01-FX-4
            booking_date: 2022-03-18                # booked the day the fixture fixed the USD amount
            direction: BUY_USD
            notional_usd: 260400.0
            value_date: 2022-05-16                  # freight collect, against the middle arrival
            matched_leg: FREIGHT

    rationale:
      parity_week_end: 2022-03-04
      cited_columns: [net_arb_inr_t, net_arb_pit_mix_inr_t, net_arb_conv18k_inr_t, grade_factor,
                      freight_base_usd_t, lme_3m_usd_t]
      text: >-
        Zorba on the US lane cleared all three screens in the week to 04-Mar-2022 with 49,904 ₹/MT on the base
        run, 14,650 on the point-in-time mix and 44,711 with conversion stressed to 18,000 — the widest the
        book will ever see, and the point-in-time number is the one that makes me small rather than large. Then
        this morning the LME gave back 484 dollars in a day off an all-time high, which is the first honest
        price in a fortnight. I buy fixed FOB rather than on a formula: at 2,340 I have locked a 70 % discount
        to a metal price that has just been marked down, and a monthly-average formula two months out would
        leave me guessing in a market that has clearly stopped going up. I take the freight open because the US-India index is down on the
        week and five dollars under where it stood in late January, and because at 106 dollars a tonne it is small
        against the metal — but the stop is
        written down at plus 15 % and the boxes get booked by 18-Mar whatever happens, so the decision is not
        mine to postpone. I want 300 lots of MCX against 90 % of the LME-equivalent length, split 200/100
        because I expect to place this cargo in two parcels — but the near month has moved 12 % today, past the
        9 % slab, so the contract is bid only at the limit, if at all, and I get the short on tomorrow's session instead. One night
        naked is the risk of buying on the day the market breaks, and it cuts both ways: if the contract really
        is locked, tomorrow opens lower to catch up the rest of the move and I sell my hedge below where I could
        have sold it today. What I am knowingly running: the Zorba
        discount itself, three sailings' worth of laycan risk, and the fact that I have no buyer at any price.

  # ================================================================================================== T02
  # The Gulf-lane trade the desk actually wants: five days of transit, a buyer who signs the same day, and a
  # formula on both sides. Both legs float against different exchanges and different months, so the hedge is
  # sized on the residual and flips from short to long when the sale prices ahead of the purchase.
  - trade_id: T02
    status: EXECUTED
    trade_date: 2022-03-11
    lane: JEA_NSA
    grade: tense
    quantity_mt: 1200.0                        # 48 x 20ft at container_payload_mt_20ft_tense = 25.0 MT

    purchase:
      supplier_id: SUP_JEA_01
      spa_ref: "SPA/JEA/2203-02 (SIM)"
      incoterm: CFR
      named_place: "CFR Nhava Sheva, India"
      spa:
        isri_grade_spec: "Tense, ISRI Scrap Specifications Circular 2022"
      pricing:
        type: LME_M1_AVG
        lme_reference: CASH                    # LME Official Cash Settlement (exchange.yaml lme_pricing_reference)
        factor_frac: 0.638
        premium_usd_t: 0.0
        provisional_frac: 0.95
        terms_basis_note: >-
          grade_factor_tense on 11-Mar-2022 is 0.641857 of LME 3M on a CFR basis. Contracted at 0.638 flat
          against the official cash average of the month after shipment — 0.39 of a point under the trade-date
          factor. That concession is commercial and should be called that: it is what a Gulf trader gives to move
          a full 48-box parcel of Tense to a counterparty it has shipped for four years. It is NOT the price of
          the tenor, and an earlier draft of this note said it was: 0.39 of a point over 90 days implies about
          2.4 % p.a., under the register's own usance_interest_spread_pa over the benchmark, and a seller
          granting credit does not also cut its price. The tenor is paid for separately and visibly, in the
          USANCE_INTEREST and LC usance-fee cashflows the engine books against this ticket. The seller takes an
          unconfirmed 90-day Indian acceptance because the paper it holds is the issuing bank's obligation, not
          the desk's: it discounts the accepted draft with its own bank in Jebel Ali and is paid at sight, which
          is also why it does not ask for confirmation on a lane it ships every month. The April laycan sits
          inside one calendar month, so the quotational period is fixed and known at signature — but it is fixed
          only as long as the vessel is: a bill of lading that slips into the next month takes the whole
          quotational period with it, and this ticket has eleven days of laycan slack and nothing else standing
          against that (docs/20_trade_book.md §6.5).
      payment:
        instrument: LC_USANCE
        usance_days: 90
        lc_open_date: 2022-03-21
        issuing_bank: "Bharat Mercantile Bank Ltd (SIM)"
        confirmed: false                       # SUP_JEA_01 accepts an unconfirmed LC on this lane

    shipment:
      laycan_start: 2022-04-01
      laycan_end: 2022-04-22
      load_port: "Jebel Ali, UAE"
      discharge_port: NHAVA_SHEVA
      lots:
        - lot_id: L1
          boxes: 24
          bl_date: 2022-04-05
          vessel: "MV Gulf Kestrel (SIM)"
          voyage: "214W (SIM)"
        - lot_id: L2
          boxes: 24
          bl_date: 2022-04-13
          vessel: "MV Sharjah Bay (SIM)"
          voyage: "216W (SIM)"

    sales:
      - sale_id: S1
        buyer_id: BUY_JNPT_01
        contract_date: 2022-03-11              # back-to-back: sold the day the cargo is bought
        lot_ids: [L1, L2]
        delivery_basis: "FOR buyer's works, Taloja (SIM)"
        quality_passthrough: true
        pricing:
          type: MCX_AVG
          mcx_series: M1
          window_start: 2022-04-19
          window_end: 2022-04-29
          factor_frac: 0.916                   # recovery_frac_tense = (1-0.005)(1-0.02)(0.94) = 0.9166
          premium_inr_t: -51900.0
          terms_basis_note: >-
            Delivery-month formula: 0.916 x the MCX near-month average over the nine trading days to 29-Apr-2022,
            in ₹/MT, less 51,900 ₹/MT. On 11-Mar-2022 levels (M1 287.821 ₹/kg) that prices the cargo at
            211,744 ₹/MT, against an import replacement value of 178,826 and a smelter netback of 244,567 —
            i.e. the desk's standing half-the-gap rule, 211,697, to within the rounding of the premium to the
            nearest 100 ₹/MT. The discount is wide because the arbitrage was wide that week, not because the
            formula is unusual.
        payment:
          terms: CREDIT
          credit_days: 30

    hedges:
      mcx:
        hedge_ratio_target: 1.0
        exposure_basis: NET_LME_EQ_DELTA
        basis_risk_note: >-
          Both legs float, but against different exchanges, different references and different months: the
          purchase settles on the LME official cash average for the month after shipment, the sale on the MCX
          near-month average over nine days in April. Until the sale prices, the desk is net long roughly a
          third of a tonne of LME-equivalent metal per tonne of scrap — the sale's recovery factor grossed up by
          duty parity (0.916 x 1.0825) less the purchase factor 0.638 — so the hedge starts short. Once the
          sale's average is behind us and the purchase's is not, the position is short the full purchase factor
          and the hedge flips long. What no hedge can cover here is the gap between MCX duty-paid primary parity
          and an LME-priced scrap cargo, nor the fact that the two averaging windows do not overlap at all; the
          desk treats an averaging leg as fully open before its window and closed after its midpoint trading
          day, which is an approximation and is the reason the flip is one decision rather than nine. In base
          runs the panel MCX series is a parity proxy, so the reported basis is zero by construction. One artefact to name, because this line rolls: the panel's MCX M1 and M2 are built from one spot by a deterministic interest carry, so the curve is in contango by construction and every roll of a short in this book shows a gain; the real contract can and does go into backwardation, when the metal part of the same roll costs money.
        tranches:
          - hedge_id: T02-MCX-1
            contract_month: "2022-03"
            direction: SELL
            lots: 74
            entry_date: 2022-03-11
            exit_date: 2022-03-22                # 7 trading days before the 31-Mar expiry
            exit_reason: ROLL
            roll_to: T02-MCX-2
          - hedge_id: T02-MCX-2
            contract_month: "2022-04"
            direction: SELL
            lots: 74
            entry_date: 2022-03-22
            exit_date: 2022-04-20                # 7 trading days before the 29-Apr expiry
            exit_reason: ROLL
            roll_to: T02-MCX-3
          - hedge_id: T02-MCX-3
            contract_month: "2022-05"
            direction: SELL
            lots: 74
            entry_date: 2022-04-20
            exit_date: 2022-04-25                # midpoint trading day of the sale's averaging window
            exit_reason: UNWIND
          - hedge_id: T02-MCX-4
            contract_month: "2022-05"
            direction: BUY
            lots: 145
            entry_date: 2022-04-25
            exit_date: 2022-05-17                # midpoint trading day of the purchase quotational period
            exit_reason: UNWIND
      fx_forwards:
        hedge_frac_target: 1.0
        lines:
          - fwd_id: T02-FX-1
            booking_date: 2022-04-05              # booked when the L1 provisional invoice value is fixed on the B/L
            direction: BUY_USD
            notional_usd: 1241900.0
            value_date: 2022-07-04                # L1 B/L + 90 days usance
            matched_leg: PURCHASE_PROVISIONAL
          - fwd_id: T02-FX-2
            booking_date: 2022-04-13
            direction: BUY_USD
            notional_usd: 1166000.0
            value_date: 2022-07-12                # L2 B/L + 90 days usance
            matched_leg: PURCHASE_PROVISIONAL
          - fwd_id: T02-FX-3
            booking_date: 2022-06-01              # the quotational month closed the day before; the balance is a refund
            direction: SELL_USD
            notional_usd: 240000.0
            value_date: 2022-07-04
            matched_leg: PURCHASE_FINAL

    rationale:
      parity_week_end: 2022-03-11
      cited_columns: [net_arb_inr_t, net_arb_pit_mix_inr_t, net_arb_conv18k_inr_t, grade_factor,
                      mcx_anchor_inr_kg, lme_cash_3m_spread_usd_t]
      text: >-
        Tense on the Gulf lane is the best case on the board this week — 63,523 ₹/MT base, 28,042 on the
        point-in-time mix, 58,024 with conversion at 18,000 — and it is the trade I want for reasons that have
        nothing to do with the size of that number: five days of transit, a buyer in Taloja who will sign the
        same afternoon, and a formula on both sides so I am not taking a view on where the LME goes from here.
        After Tuesday's 484-dollar break I do not want to be long flat price on a guess. I price the purchase on
        the cash average of the month after shipment because an April laycan makes that period certain at
        signature, and I take the 90-day usance because the cargo will be sold, delivered and collected before
        I have to pay for it — the usance interest is cheaper than my working-capital line and it turns a
        funding problem into a priced one. What I am actually trading is the gap between a 0.638 purchase factor
        and a sale that grosses up to about 0.99 of LME through duty parity: a third of a tonne of metal per
        tonne of scrap, which is why I sell 74 lots now and expect to be buying 145 back once the buyer's April
        average is behind me and my own is not. I know the flip costs me a spread and I know the eleven-day gap
        between the two windows is unhedgeable. The risk I would call out to the desk head is the origin: a
        pre-shipment inspection that goes wrong at Jebel Ali stops the whole cargo, and UAE material is outside
        the safe-origin list.

  # ================================================================================================== T03
  # Fixed-price CFR Taint/Tabor, the last week the grade clears the point-in-time screen with anything to spare.
  # Twenty-tonne boxes, so the payload scaling pushes freight and port charges up per tonne even on a CFR buy.
  - trade_id: T03
    status: EXECUTED
    trade_date: 2022-03-23
    lane: JEA_NSA
    grade: taint_tabor
    quantity_mt: 1200.0                        # 60 x 20ft at container_payload_mt_20ft_taint_tabor = 20.0 MT


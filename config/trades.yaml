        can move 12 % in a session; and on this grade the point-in-time screen is telling me the discount, not
        the flat price, is the risk, and MCX does not hedge a discount at any ratio. If the market keeps
        falling this costs me, and I would rather pay for a decision I made than for one I did not.

  # ================================================================================================== T05
  # CFR Tense on the US lane, priced on the LME cash average of the month after shipment and sold back-to-back

      text: >-
        Tense on the US lane in the week to 20-May-2022: 22,935 ₹/MT base, 39,374 point-in-time, 17,436 with
        conversion stressed. For once the point-in-time mix is the friendly number and the base is the cautious
        one, which is the opposite of March and tells me the reconstruction has stopped flattering me. It still
        clears all three, so I buy — 90 boxes, fixed FOB at 2,086, which is 12 dollars under my netback from a
        yard that hand-sorts. That last point is the whole risk on this ticket and I am pricing it: the SPA
        carries the moisture franchise, the contamination schedule and the radioactivity clause in writing, and
        I would rather take a claim on a seller than a rejection at a portal monitor. Freight I fix on 27-May at
        the stop's book-by date; the index has halved since the start of the window and I am not going to be
        clever about the last twenty dollars. I sell 247 lots against 90 % of the length and I know I am rolling through three
        contract months before these boxes are discharged — that roll cost is what holding unsold cargo on a
        forty-day lane actually costs, and I would rather see it as a line item than pretend it is free. I have
        no buyer. The realistic home for this parcel is Rajkot, which means a foundry with a ₹120 mn limit
        taking ₹300 mn of cargo, so it will be majority-advance or it will not happen. I want that written down
        as an exposure and not as a mitigation: a 70 % advance from that name is roughly ₹220 mn of cash I am
        relying on from a balance sheet whose own line I set at ₹120 mn, which is 1.8 times my own advance cap.
        If the advance does not arrive I own 1,890 tonnes of Tense with the hedge already lifted, and that is a
        worse outcome than a late receivable. I am taking it because the alternative is not placing the parcel,
        and the desk should count it as a breach of policy in substance even though the limit definition only
        counts receivables. Two other things worry me: a US-origin Tense parcel I have not inspected, and a
        Gujarat foundry buying into a falling ingot market, which is exactly the name that pays late.


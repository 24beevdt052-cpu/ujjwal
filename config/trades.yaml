            there is no payment-terms adjustment either way, and the parcel went at 201,250.
        payment:
          terms: CREDIT
          credit_days: 30

    hedges:
      mcx:
        hedge_ratio_target: 0.90
        exposure_basis: NET_LME_EQ_DELTA
        basis_risk_note: >-
          A fixed-price cargo with no buyer is a naked long in LME-equivalent metal, marked at what it would
          cost to replace it, so the MCX short is the entire risk management on this ticket until a sale is
          contracted. It leaves three exposures open and the desk is taking all three deliberately: the
          Taint/Tabor discount to LME, which is where most of this grade's volatility actually lives; one roll
          from the April into the May contract; and the divergence between MCX duty-paid primary parity and the
          scrap the desk owns. In base runs the panel MCX series is a parity proxy, so the reported
          cross-exchange basis is zero by construction and only the mirror run carries evidence of it. One artefact to name, because this line rolls: the panel's MCX M1 and M2 are built from one spot by a deterministic interest carry, so the curve is in contango by construction and every roll of a short in this book shows a gain; the real contract can and does go into backwardation, when the metal part of the same roll costs money.
        tranches:
          - hedge_id: T03-MCX-1
            contract_month: "2022-04"
            direction: SELL
            lots: 143
            entry_date: 2022-03-23
            exit_date: 2022-04-20
            exit_reason: ROLL
            roll_to: T03-MCX-2
          - hedge_id: T03-MCX-2
            contract_month: "2022-05"
            direction: SELL
            lots: 143
            entry_date: 2022-04-20
            exit_date: 2022-04-26                # lifted the day the domestic sale is contracted
            exit_reason: UNWIND
      fx_forwards:
        hedge_frac_target: 1.0
        lines:
          - fwd_id: T03-FX-1
            booking_date: 2022-04-13                # dealt on the L1 B/L: the payment date exists only then
            direction: BUY_USD
            notional_usd: 1482000.0
            value_date: 2022-04-20                # L1 B/L + 7 days
            matched_leg: PURCHASE_INVOICE
          - fwd_id: T03-FX-2
            booking_date: 2022-04-22
            direction: BUY_USD
            notional_usd: 1482000.0
            value_date: 2022-04-29                # L2 B/L + 7 days
            matched_leg: PURCHASE_INVOICE

    rationale:
      parity_week_end: 2022-03-18
      cited_columns: [net_arb_inr_t, net_arb_pit_mix_inr_t, net_arb_conv18k_inr_t, grade_factor, payload_scale]
      text: >-
        Taint/Tabor on the Gulf lane passes all three screens in the week to 18-Mar-2022, but the honest number
        is the point-in-time one at 10,406 ₹/MT against 43,205 on the base run — a four-fold gap that says most
        of this margin is the lag-2 grade mix, not something I can bank. So I take a 60-box parcel, not a
        shipload, and I take it fixed because at 2,470 CFR the seller has given me 15 dollars under my own
        parity for clearing material it has carried since February. The LME has bounced 306 dollars off the
        15-Mar low and I do not believe it; a fixed price today is a position I can hedge, a formula is a
        position I cannot. The detail that matters on this grade is the box: Taint/Tabor loads 20 tonnes in a
        twenty-footer against a 25-tonne base, so every per-box cost — freight, port, the pre-shipment
        inspection on Gulf origin — is a quarter more expensive per tonne than the lane table suggests, and
        that is already in the 201-odd thousand rupees I need domestically to make this work. I sell 143 lots
        against 90 % of the length, roll once into May, and accept that I am carrying the scrap discount naked.


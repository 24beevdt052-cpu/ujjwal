          quarter of a tonne per tonne of scrap — 105 lots at inception. When the purchase quotational period
          closes first the long becomes the whole cargo, so the hedge is increased by 279 lots rather than
          lifted, and both lines come off together when the sale's window passes its midpoint. The
          unhedgeable parts are the same as elsewhere: MCX prices duty-paid primary metal, the desk owns Tense
          scrap, and the two averaging windows do not overlap. In base runs the panel MCX series is a parity
          proxy, so the measured cross-exchange basis is zero by construction. One artefact to name, because this line rolls: the panel's MCX M1 and M2 are built from one spot by a deterministic interest carry, so the curve is in contango by construction and every roll of a short in this book shows a gain; the real contract can and does go into backwardation, when the metal part of the same roll costs money.
        tranches:
          - hedge_id: T05-MCX-1
            contract_month: "2022-05"
            direction: SELL
            lots: 105
            entry_date: 2022-04-21
            exit_date: 2022-05-20
            exit_reason: ROLL
            roll_to: T05-MCX-2
          - hedge_id: T05-MCX-2
            contract_month: "2022-06"
            direction: SELL
            lots: 105
            entry_date: 2022-05-20
            exit_date: 2022-06-21
            exit_reason: ROLL
            roll_to: T05-MCX-4
          - hedge_id: T05-MCX-3
            contract_month: "2022-07"
            direction: SELL
            lots: 279
            entry_date: 2022-06-16              # midpoint trading day of the purchase quotational period
            exit_date: 2022-07-04               # midpoint trading day of the sale's averaging window
            exit_reason: UNWIND
          - hedge_id: T05-MCX-4
            contract_month: "2022-07"
            direction: SELL
            lots: 105
            entry_date: 2022-06-21
            exit_date: 2022-07-04
            exit_reason: UNWIND
      fx_forwards:
        hedge_frac_target: 1.0
        lines:
          - fwd_id: T05-FX-1
            booking_date: 2022-05-10
            direction: BUY_USD
            notional_usd: 1874500.0
            value_date: 2022-07-11              # L1 B/L + 60 days usance, rolled to the next trading day
            matched_leg: PURCHASE_PROVISIONAL
          - fwd_id: T05-FX-2
            booking_date: 2022-05-18
            direction: BUY_USD
            notional_usd: 1992200.0
            value_date: 2022-07-18
            matched_leg: PURCHASE_PROVISIONAL
          - fwd_id: T05-FX-3
            booking_date: 2022-07-01            # the quotational month closed the day before; the balance is a refund
            direction: SELL_USD

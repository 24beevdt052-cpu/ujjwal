            T08-LOG-3, fourteen simulated days of it. The alarmed box itself stays under hold for
            rejected_box_hold_days (45, ASSUMPTION) accruing slabbed detention, and is then re-exported at
            rejected_box_reexport_cost_usd_per_box (3,000, ASSUMPTION) — both paid by the desk first and claimed
            back at the recovery below. Decontamination or disposal of a genuinely contaminated box, which can cost
            far more, is NOT modelled. The goods deduction is set off against the final invoice, which
            secures the cash but not the claim: the seller disputes the survey and the settlement hands back the
            share it does not accept, so recovery is 0.6 and not 1.0 (Phase 3 publishes 0.0 and 1.0 beside it). The remaining 39 boxes
            settle with a small moisture deduction and a 0.6 % contamination discount. Magnitudes are
            simulated; the clause and the portal are real (commercial.yaml radioactivity_clause).
      logistics:
        - event_id: T08-LOG-1
          lot_id: L1
          known_date: 2022-07-28
          arrival_delay_days: 7
          extra_dwell_days: 0
          real_trigger_ref: >-
            Container News, 27-Jul-2022: carriers void calls at Nhava Sheva and Mundra
            (docs/research/freight_notes.md S4)
          flag: SIM
          note: >-
            The real, dated trigger; the seven days are simulated. This is the channel a voided call actually
            works through: the box is still at sea on 27-Jul, its scheduled call is omitted, and it is carried
            past and returned on a later service. None of it is landside — free time does not start until the
            box is discharged — so it costs a week of holding an unsold, already priced cargo and a week of
            everything that hangs off the Bill of Entry, not demurrage.
        - event_id: T08-LOG-2
          lot_id: L2
          known_date: 2022-07-28
          arrival_delay_days: 7
          extra_dwell_days: 0
          real_trigger_ref: >-
            Container News, 27-Jul-2022: carriers void calls at Nhava Sheva and Mundra
            (docs/research/freight_notes.md S4)
          flag: SIM
          note: >-
            Same trigger and the same simulated seven days on the second sailing, which was also still afloat
            when the omission was announced.
        - event_id: T08-LOG-3
          lot_id: L2
          known_date: 2022-08-16
          arrival_delay_days: 0
          extra_dwell_days: 14
          real_trigger_ref: >-
            Radiation portal monitors and the AERB/Customs referral procedure at Indian ports
            (commercial.yaml radioactivity_clause) — the mechanism is real, this consignment is not
          flag: SIM
          note: >-
            The landside half of the radiation event, kept separate from it so the cost is visible. One alarmed
            box holds the whole consignment's Bill of Entry: fourteen simulated days of referral take this
            lot's dwell to 24 against 14 free days, so 10 days are chargeable on the 39 boxes that were not
            rejected — and charged up the registered detention slabs, not all at the first-slab rate. This is
            why a rejection is not free even when the SPA puts the box on the seller's account.

    rationale:
      parity_week_end: 2022-06-03
      cited_columns: [net_arb_inr_t, net_arb_pit_mix_inr_t, net_arb_conv18k_inr_t, grade_factor,
                      mcx_anchor_inr_kg]
      text: >-
        This is the last week Tense clears anything on the US lane before the window shuts — 14,383 ₹/MT base
        and 8,883 with conversion at 18,000, against 39,488 on the point-in-time mix, and when the three screens
        disagree by that much I trust the smallest one. So the parcel is 80 boxes and it is bought on a formula,
        not fixed: at 0.782 against the cash average of the month after shipment I am paying what the market
        pays when the metal actually arrives, which on a forty-day lane into a falling market is the difference
        between a trade and a bet. I have no buyer today. Gandhidham is the natural home but its line is full
        until my previous invoice clears, so I am going to be holding unsold, formula-priced cargo for a while
        and I am content with that: while both the payable and the mark float, this position has essentially no
        flat-price risk — the factors differ by four thousandths — and I am not going to pay a spread to hedge
        one lot. The day my quotational month is behind me that changes completely and I will need about 230
        lots on. The other thing I am pricing in is the yard: this is the same Delaware seller whose last parcel
        I have not yet surveyed, so the SPA again carries the full franchise, discount and radioactivity
        schedule, and the buyer contract will pass the discount through rather than leaving me between the two.

  # ================================================================================================== T09
  # The last trade of the window. Short-lane Tense on a 60-day usance so the whole ticket — LC, duty, IGST
  # credit, buyer receipt and both forwards — settles inside the 31-Oct horizon.
  - trade_id: T09
    status: EXECUTED
    trade_date: 2022-08-03
    lane: JEA_NSA
    grade: tense
    quantity_mt: 1200.0                        # 48 x 20ft at container_payload_mt_20ft_tense = 25.0 MT

    purchase:
      supplier_id: SUP_JEA_01
      spa_ref: "SPA/JEA/2208-09 (SIM)"
      incoterm: CFR
      named_place: "CFR Nhava Sheva, India"
      spa:
        isri_grade_spec: "Tense, ISRI Scrap Specifications Circular 2022"
      pricing:
        type: FIXED
        price_usd_t: 1827.0
        terms_basis_note: >-
          CFR-India parity on 03-Aug-2022 = LME 3M 2,401.0 x grade_factor_tense 0.765161 = 1,837.15 USD/t.
          Contracted at 1,827.00 CFR, 10.15 USD/t under parity.
      payment:
        instrument: LC_USANCE
        usance_days: 60
        lc_open_date: 2022-08-05                 # >= lc_open_days_before_laycan_min ahead of the 15-Aug laycan
        issuing_bank: "Bharat Mercantile Bank Ltd (SIM)"
        confirmed: false

    shipment:
      laycan_start: 2022-08-15
      laycan_end: 2022-08-26
      load_port: "Jebel Ali, UAE"
      discharge_port: NHAVA_SHEVA
      lots:
        - lot_id: L1
          boxes: 24
          bl_date: 2022-08-17
          vessel: "MV Khaleej Dawn (SIM)"
          voyage: "245W (SIM)"
        - lot_id: L2
          boxes: 24
          bl_date: 2022-08-24
          vessel: "MV Ras Al Khor (SIM)"
          voyage: "247W (SIM)"

    sales:
      - sale_id: S1
        buyer_id: BUY_JNPT_01
        contract_date: 2022-08-26
        lot_ids: [L1, L2]
        delivery_basis: "FOR buyer's works, Taloja (SIM)"
        pricing:
          type: FIXED
          price_inr_t: 168500.0
          terms_basis_note: >-
            Priced on 26-Aug-2022 between an import replacement value of 158,984 ₹/MT and a netback of
            178,570 ₹/MT; half the gap is 168,777 ₹/MT, and the 25 % advance is worth
            168,777 x 10.20 % x 7.5/365 = 354 ₹/MT of the desk's own working-capital cost, which the buyer
            keeps. 168,423 ₹/MT, contracted at 168,500.
        payment:
          terms: ADVANCE_PLUS_CREDIT
          advance_frac: 0.25
          advance_date: 2022-08-31
          credit_days: 30

    hedges:
      mcx:
        hedge_ratio_target: 0.90
        exposure_basis: NET_LME_EQ_DELTA
        basis_risk_note: >-
          Fixed price, no buyer for three weeks, so the position is a naked LME-equivalent long marked at
          replacement value and hedged with 157 lots of MCX. The roll on 18-Aug is the one place in this book
          where the panel's monthly slot and the exchange's real calendar disagree: the DIRECT expiry list puts
          August expiry on 30-Aug while the panel's rule-based slot is 31-Aug, and the position is keyed to the
          contract month so that both views resolve to the same contract. The cross-exchange mismatch is the
          usual one and in base runs the measured basis is zero by construction, the panel MCX series being a
          parity proxy. The roll on this line is worth naming twice: the panel builds M1 and M2 from one spot
          with a deterministic interest carry, so its curve is always in contango and rolling a short always
          shows a gain — while the LME's own cash-3M curve has been in backwardation for a fortnight, and in
          backwardation the metal part of a short roll costs money; on a parity curve that carried the LME slope
          only the rupee-over-dollar rate carry would keep this roll positive. The gain this roll reports is
          mostly the proxy's rupee carry, not a market view.
        tranches:
          - hedge_id: T09-MCX-1
            contract_month: "2022-08"
            direction: SELL
            lots: 157
            entry_date: 2022-08-03
            exit_date: 2022-08-18                # 7 trading days before the DIRECT 30-Aug expiry
            exit_reason: ROLL
            roll_to: T09-MCX-2
          - hedge_id: T09-MCX-2
            contract_month: "2022-09"
            direction: SELL
            lots: 157
            entry_date: 2022-08-18
            exit_date: 2022-08-26                # lifted the day the domestic sale is contracted
            exit_reason: UNWIND
      fx_forwards:
        hedge_frac_target: 1.0
        lines:
          - fwd_id: T09-FX-1
            booking_date: 2022-08-17                # dealt on the L1 B/L: the payment date exists only then
            direction: BUY_USD
            notional_usd: 1096200.0
            value_date: 2022-10-17               # L1 B/L + 60 days usance, rolled to the next trading day
            matched_leg: PURCHASE_INVOICE
          - fwd_id: T09-FX-2
            booking_date: 2022-08-24
            direction: BUY_USD
            notional_usd: 1096200.0
            value_date: 2022-10-24
            matched_leg: PURCHASE_INVOICE

    rationale:
      parity_week_end: 2022-07-29
      cited_columns: [net_arb_inr_t, net_arb_pit_mix_inr_t, net_arb_conv18k_inr_t, grade_factor,
                      mcx_anchor_inr_kg, lme_cash_3m_spread_usd_t]
      text: >-
        Tense on the Gulf lane reopened in the week to 22-Jul-2022 and is wider again in the week to
        29-Jul-2022: 15,206 ₹/MT base, 26,505 point-in-time, 9,706 with conversion stressed. It is open on all
        three and it is the only thing on the board that is. The reason it reopened is not that scrap got
        cheaper — the rupee went through 80 and then came back, and the LME has put 82 dollars on since the
        15-Jul low while the domestic anchor has not given it all back. The curve has also flipped: cash has
        been trading over the three-month for a fortnight, which is the first backwardation since March and
        argues against holding metal for its own sake. So this is a fast trade and a small one, 48 boxes on the
        five-day lane, fixed at 1,827 CFR. The structure is chosen for the calendar as much as the margin: a
        60-day usance on a mid-August B/L means the bill, the duty, the IGST credit, the buyer's money and both
        forwards all land inside the desk's settlement horizon, and I do not want an open position I cannot
        close in the quarter I am trading. I sell 157 lots against 90 % of it and expect to roll once, out of the August
        contract, before Taloja signs.

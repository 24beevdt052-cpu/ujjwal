      cited_columns: [net_arb_inr_t, net_arb_pit_mix_inr_t, net_arb_conv18k_inr_t, grade_factor,
                      mcx_anchor_inr_kg]
      text: >-
        Tense on the US lane in the week to 15-Apr-2022 is the first case this book has seen where the three
        screens agree: 42,670 ₹/MT base, 40,778 point-in-time, 37,170 with conversion stressed. When the
        point-in-time mix stops disagreeing with the lag-2 mix, the margin is telling me something about the
        market rather than about my own reconstruction, and that is worth being larger for — 100 boxes, the
        biggest parcel on this lane in the book. I buy it on the cash average of the month after shipment and
        sell it back-to-back on the buyer's delivery-month MCX average, because on a forty-day transit I do not
        want six weeks of flat-price risk I am not paid to take. The 60-day usance on a confirmed instrument
        costs me a confirmation fee I would rather not pay, but it means the cargo is sold and the first
        collection is in before I settle the bill, and the seller wanted the instrument more than it wanted the
        last third of a point on the factor — a concession to place a hundred boxes, not the price of the tenor,
        which I pay for in acceptance interest and a confirmation fee. The exposure I am left with is the one I actually want: the
        sale grosses up to 0.99 of LME through duty parity against a 0.702 purchase, so a quarter of a tonne
        per tonne of scrap is live until both averages are behind me, and I sell 105 lots against it today.
        What I am watching: my own quotational month closes three weeks before the buyer's window opens, so
        there is a stretch where I own priced metal against an unpriced sale and the hedge has to grow, not
        shrink. The rupee at 76.21 is the other thing — I cover the whole usance payable forward on each B/L,
        when the provisional invoice fixes what I owe and when. The final balance I do not cover until the
        quotational month is shut: its size and even its sign are unknown until then, and a forward against a
        number I have invented is a position, not a hedge.


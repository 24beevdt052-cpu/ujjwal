    sales:
      - sale_id: S1
        buyer_id: BUY_RJK_01
        contract_date: 2022-05-24
        lot_ids: [L1, L2]
        delivery_basis: "FOR buyer's works, Rajkot (SIM)"
        pricing:
          type: FIXED

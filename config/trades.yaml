  - trade_id: T05
    status: EXECUTED
    trade_date: 2022-04-21
    lane: USEC_MUN
    grade: tense
    quantity_mt: 2100.0                        # 100 x 40ft at container_payload_mt_40ft_tense = 21.0 MT

    purchase:
      supplier_id: SUP_USEC_01
      spa_ref: "SPA/USEC/2204-05 (SIM)"
      incoterm: CFR
      named_place: "CFR Mundra, India"
      spa:
        isri_grade_spec: "Tense, ISRI Scrap Specifications Circular 2022"
      pricing:
        type: LME_M1_AVG
        lme_reference: CASH
        factor_frac: 0.702
        premium_usd_t: 0.0
        provisional_frac: 0.95
        terms_basis_note: >-
          grade_factor_tense on 21-Apr-2022 is 0.705400 of LME 3M on a CFR basis. Contracted at 0.702 flat
          against the official cash average of the month after shipment — 0.34 of a point under the trade-date
          factor. As on T02 that is a commercial concession on a 100-box parcel and not the price of the tenor:
          0.34 of a point over 60 days implies about 2.9 % p.a., under the register's own
          usance_interest_spread_pa over the benchmark. The 60 days are paid for in the USANCE_INTEREST
          cashflow, and the confirmation this seller insists on is paid for by the desk
          (confirmation_charges_for: APPLICANT) — neither of them is inside the factor. The May laycan sits
          inside one calendar month, so the quotational period is known at signature, and stays known only

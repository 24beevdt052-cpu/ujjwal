                      mcx_anchor_inr_kg]
      text: >-
        The Zorba window is closing. In the week to 06-May-2022 the Gulf lane gives 12,842 ₹/MT base and only
        7,649 once conversion is stressed to 18,000 — a quarter of what the same screen paid in March — and on
        my reading this is the last week I can put a Zorba parcel on the books at all. So I take one, 50 boxes,
        fixed CFR at 2,138, and I take it small. The reason I am still interested is the factor: Zorba has gone
        from 0.699 of LME on 08-Mar to 0.792 today because yards have simply refused to follow the exchange
        down, and a cargo bought at a sticky discount into a falling flat price is a position where my hedge
        does the work and the discount is on my side. I sell 176 lots against 90 % of the length and roll once.
        The decision worth arguing about is the dollar. I am covering 60 % of the payable, not the whole thing.
        The rupee is at 77.26, almost a rupee weaker than three sessions ago; my policy is to cover the contracted USD
        payable in full, and to deal each forward on its bill of lading, when I know what I owe and when I owe
        it — which also means I am uncovered from today until the first B/L, a fortnight of rupee I am carrying
        whether I like it or not. But this cargo has no rupee revenue attached to it yet, and a fully covered
        payable against an uncontracted sale is not a hedge, it is a view. I will cover the balance when I fix the
        domestic price and know what rupees I am actually getting. If the rupee runs away from me before then,
        that is a cost I have chosen, and it belongs in the FX bucket with my name on it.


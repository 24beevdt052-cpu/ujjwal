          boxes: 50
          bl_date: 2022-05-18
          vessel: "MV James River (SIM)"
          voyage: "133E (SIM)"

    sales:
      - sale_id: S1
        buyer_id: BUY_MUN_01
        contract_date: 2022-04-21              # back-to-back
        lot_ids: [L1, L2]

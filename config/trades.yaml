          terms_basis_note: >-
            Priced on 24-May-2022 between an import replacement value of 192,244 ₹/MT and a netback of
            199,302 ₹/MT — a gap of only 7,058 ₹/MT, against 24,000 a month earlier. Half the gap is
            195,773 ₹/MT, and 75 % paid before release is worth 195,773 x 9.70 % x 22.5/365 = 1,171 ₹/MT of
            the desk's own working-capital cost, which the buyer keeps. 194,602 ₹/MT, contracted at 194,500 —
            barely above replacement: by late May this grade no longer paid for the risk of holding it.

          vessel: "MV Hormuz Trader (SIM)"
          voyage: "220W (SIM)"
        - lot_id: L2
          boxes: 30
          bl_date: 2022-04-22
          vessel: "MV Musandam Spirit (SIM)"
          voyage: "222W (SIM)"

    sales:

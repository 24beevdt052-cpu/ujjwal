# ACADEMIC SIMULATION — not actual trades.
#
# The authoritative counterparty register for the Phase 2 mock trading book (CONTRACTS §6, MASTER_SPEC Table 4
# row 2.5). Every company below is FICTIONAL: the names end "(SIM)" and every record carries `flag: SIM`. No
# number here is an observation of any real company; the `profile` block exists so the Phase 5 logistic credit
# model has features that separate, and the credit limits are the desk's own policy decisions, documented in
# docs/20_trade_book.md §3.
#
# (The three-counterparty fixture used by the engine tests is `config/counterparties.example.yaml`; it is NOT
# this file and the two are deliberately disjoint so a reader can never confuse the fixture with the book.)
#
# Credit-limit policy (desk, stated before the book was priced):
#   * A limit is the cap on CREDIT exposure to that buyer = invoiced-and-unpaid receivables plus the
#     not-advance-covered part of sales already contracted but not yet invoiced. It is checked at every sale
#     booking by `desk.book.validate` and written to outputs/tables/trade_book.csv.
#   * The limit is sized at roughly 15–25 days of that buyer's own purchases, i.e. 4–8 % of its (SIM) turnover.
#     A buyer whose limit will not carry the parcel buys on an advance, or waits until the previous invoice
#     clears — both happen in this book (T04/T07 and the 26-Jul booking of T07).
#   * Suppliers carry `claims_exposure_limit_usd` instead: the cap on what the desk may be owed BY a seller
#     (M+1 final-invoice refunds and quality claims), which is the only direction credit runs on the buy side
#     once the cargo is paid for under an LC.
#
# Provenance: every field is SIM (a simulated counterparty) except the registered policy caps it is checked
# against — `msme_max_payment_days` (DIRECT, 45) and `fx_hedge_no_documentation_limit_usd` (DIRECT).


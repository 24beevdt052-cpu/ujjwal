# EXAMPLE — engine test fixture (SIM). NOT the trade book.
#
# ACADEMIC SIMULATION — not actual trades. Every counterparty below is fictional and its name ends "(SIM)".
# This file exists so `desk.book.schema` and the Phase 3 engine have a fixed, checked-in book to load in tests. The
# authoritative book lives in `config/counterparties.yaml` (Phase 2, CONTRACTS §6) and is built separately.
#
# Profile numbers are ASSUMPTION: they are chosen to span the score range so the Phase 5 logistic credit model has
# something to separate. They are not observations of any real company.


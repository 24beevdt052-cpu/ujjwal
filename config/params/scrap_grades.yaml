grade_falling_market_logic:
  value: "In a sharp LME fall scrap prices lag, so the factor (scrap ÷ LME) RISES and the absolute USD discount narrows; in a spike the factor FALLS. Buyers' bids then widen discounts once LME stabilises."
  unit: text
  flag: PROXY
  source: >-
    [DGCIS] lagged unit-value ratio: 0.70 (Mar-2022 contracts, LME 3M avg $3,543) → 0.87 (Jun) → 0.88 (Jul) → 0.81
    (Aug). [USGS] Table 7 ÷ Table 6, US old sheet / LME cash: 0.537 (Mar-2022) → 0.606 (Apr) → 0.599 (May–Jun) →
    0.561 (Aug); old cast 0.522 → 0.607 (Jun) → 0.568 (Aug); and in the 2021 rally old sheet fell from 0.669 (Mar-2021)
    to 0.519 (Sep-2021).
  verify: "VERIFIED 2026-09-16 as a pattern in two independent public datasets (direction only, not grade-specific levels)"
  note: >-
    Trader implication: a desk that buys scrap on a fixed % of LME in a crash is paying away the stickiness to the
    supplier; the seller prefers fixed-USD offers in a falling market and %-of-LME in a rising one. This is why the
    desk's M+1 LME-linked SPAs (Table 4 row 2.4) are safer for the buyer than fixed prices when LME is falling fast.

# ---------------------------------------------------------------------------------------------------------------
# Recovery physics (CONTRACTS §5: recovery = (1 − moisture) × (1 − contamination) × metal_yield; aluminium only)
# ---------------------------------------------------------------------------------------------------------------
moisture_frac_zorba:
  value: 0.01
  unit: frac_of_gross_weight
  flag: ASSUMPTION
  source: "ISRI 2022 Zorba spec sets metal content by agreement and requires the lot free of radioactive material, dross and ash, but sets no moisture limit; the sister fragmentizer grades require material to be 'dry' (Twitch/Tweak). Level = desk SPA franchise (standard_moisture_franchise_frac)"
  verify: "N/A — assumption; SPA-driven"
  note: "Shredded Zorba from wet media separation can arrive at 1–3% moisture; the SPA deducts weight above the 1% franchise, so the desk pays for at most ~1%."

contamination_frac_zorba:
  value: 0.06
  unit: frac_of_dry_weight
  flag: ASSUMPTION
  source: "Trade usage of 'Zorba 95/5' (BigMint assessment name): ~95% aluminium and ~5% heavy non-ferrous (Cu, brass, Zn, stainless); ISRI 2022 Zorba: sold by estimated non-ferrous metal content, passed over magnets"
  verify: "PENDING — the 95/5 composition is trade naming, not an ISRI definition; confirm from a BigMint/Fastmarkets Zorba methodology note or a packing-list assay"
  note: "Non-aluminium fraction of the dry lot = heavies 0.05 (heavies_frac_zorba, credited separately) + ~0.01 rubber/plastic/dirt/free iron. Review fix: the previous Zorba 90 definition (0.08 contamination, 0.85 yield, no heavies credit) contradicted the Zorba 95/5 price evidence."

metal_yield_frac_zorba:

# Owned by the Phase 0 regulatory/contract research agent (revised by the Phase 0 fixer after independent review).
# ISRI grade physics (moisture / contamination / metal yield / heavies) and the grade price factors (CFR India price as a
# fraction of LME 3M) for the three desk grades: Zorba 95/5, Taint/Tabor (ISRI-clean) and Tense (ISRI-clean).
# Research trail: docs/research/regulatory_contract_notes.md §7–8. Every evidence number below is recomputed from cached
# public pages by `desk.data.fetch_price_evidence` (tables in data/interim/price_evidence/), which RAISES if this file
# and the evidence disagree.
#
# Specs: ISRI Scrap Specifications Circular 2022 (effective 07/2022), Guidelines for Nonferrous Scrap
#   https://www.isrispecs.org/wp-content/uploads/2023/05/ISRI-Scrap-Specifications-Circular-updated-1.pdf
#   cached data/raw/regulatory/isri/ISRI-Scrap-Specifications-Circular-2022-updated-1.pdf
# Price evidence:
#   [DGCIS] Ministry of Commerce TRADESTAT/MEIDB 'Import :: Commodity wise all Countries', HS 76020010 ('ALUMINIUM SCRAP
#           COVERD BY ISRI CODE ...', unit KGS), monthly US$ value and quantity, calendar-year pages 2022, 2024, 2025
#           (each also carries the prior year: 2021–2025 covered), Revised Final. POST form
#           https://tradestat.commerce.gov.in/meidb/commodity_wise_all_countries_import ; cached
#           data/raw/regulatory/tradestat/meidb_cwac_import_76020010_YYYYMM_rv{1=US$ mn,2=quantity}.html
#   [BigMint] BigMint weekly India imported-scrap assessments and reported deals, republished by AlCircle, 23 dated
#           articles 14-Feb-2024 → 18-Dec-2025 (URLs and exact sentences in desk/data/fetch_price_evidence.py; cached
#           data/raw/regulatory/alcircle/). No public 2022 grade quote exists (Fastmarkets/Argus/BigMint archives paywalled).
#   [LME]   Westmetall LME official 3M: data/processed/lme_daily.csv (2018–22) + data/raw/westmetall_lme_al_202{3,4,5}.html
#
# Construction (review fix: ONE base, CFR India basis, identical for both lanes — CONTRACTS §5 CFR parity):
#   mix(m)    = DGCIS all-origin HS 76020010 unit value in month m+2  ÷  mean LME 3M official in contract month m
#   diff_g    = median over 2024–25 BigMint quotes of [price ÷ LME 3M(D−1) ÷ (1 − stated attachments) − mix(quote month)]
#   factor_g  = mix(m) + diff_g            (breakpoints mid-contract-month, linear)
# The previous version netted an unweighted two-lane freight mean out of the CIF mix and added differentials measured
# against a "three-grade average" of three 2024 quotes; both steps were removed because they mixed bases.


usd_term_spread_3m_pa:
  value: -0.0007
  unit: rate_pa
  flag: PROXY
  source: "Calibrated in-repo: mean(US Treasury 13-week bill yield x 360/365 − fed_funds_upper_pa) over ECB days 2017-12-01..2022-12-30 = −0.00072"
  verify: "VERIFIED 2026-09-16 — recomputed from data/raw/rates/ust_daily_bill_rates_*.csv (see docs/research/market_data_notes.md)"
  note: >-
    FALLBACK ONLY: used for usd_rate_3m_pa when the Treasury bill CSVs are neither fetchable nor cached. Bills trade
    slightly below the top of the Fed range on average; the gap is not constant (quarterly means from −31bp in
    Q3-2019 to +31bp in Q3-2022, when hikes were being priced in) so the real series is always preferred.

inr_term_spread_3m_pa:
  value: -0.0012
  unit: rate_pa
  flag: PROXY
  source: "Calibrated in-repo: mean(OECD MEI India IR3TIB monthly − calendar-month mean RBI repo), 2017-12..2022-12 = −0.00121 (std 0.0045)"
  verify: "VERIFIED 2026-09-16 — recomputed from data/raw/rates/oecd_finmark_ind_ir3tib_2017-12_2022-12.csv"
  note: >-
    FALLBACK ONLY: used for inr_rate_3m_pa in any month without an OECD print. The monthly spread ranged from −94bp
    (Nov 2020, surplus liquidity) to +56bp (Nov 2022, hikes priced in), so a constant spread is a weak stand-in.


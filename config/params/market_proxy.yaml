# Owned by the Phase 0 market-data agent. Parameters of the MCX Aluminium import-parity proxy (CONTRACTS.md §4.5).

mcx_domestic_premium_inr_kg:
  value: 0.0
  unit: inr_per_kg
  flag: PROXY
  source: >-
    Calibrated in-repo against observed MCX Aluminium nearest-contract closes from a third-party mirror
    (https://commoditieschart.net/metals/aluminium/mcx-aluminium-futures-prices, retrieved 2026-09-16, cached in
    data/raw/mcx_thirdparty/commoditieschart_mcx_aluminium_nearest_raw.html via desk.data.fetch_mcx_mirror): implied premium = observed M1 / carry − duty-paid
    LME cash parity (BCD 7.5% × (1 + SWS 10%)), Mar–Aug 2022, n = 125 common days: mean −0.33, median +1.46,
    std 6.27 ₹/kg (full 2018–2022: mean −1.03, median −0.02, std 7.71).
  verify: >-
    PARTIAL — mirror data could not be checked against MCX's own bhavcopy (mcxindia.com returned Akamai HTTP 403 to
    every request on 2026-09-16). Next step: download MCX bhavcopy for 5 window dates (e.g. 07-Mar, 13-Apr, 16-Jun,
    14-Jul, 31-Aug-2022) from a browser, compare ALUMINIUM near-month closes with the mirror, then recompute.
  note: >-
    Set to 0.0 rather than the −0.33 window mean because the mean is small relative to its dispersion, the median
    has the opposite sign and monthly means swing from −9.9 (Mar 2022, MCX's 23:30 IST close lagging the LME official
    spike) to +3.5 (Jun 2022). Economically: MCX Aluminium is delivered duty-paid in India, so it should sit at LME ×
    USDINR × (1 + BCD × (1 + SWS)) with no systematic extra premium. The calibration depends on
    bcd_primary_al_hs7601 and sws_rate_on_bcd (regulatory.yaml); recompute if those change.
    REGIME BIAS (review): unbiased over the window but not within it — Friday proxy M1 minus mirror M1 is +5 to +11
    INR/kg on every March-2022 Friday (proxy too high in the LME spike; MCX's evening close lagged the LME official) and
    mostly −1 to −8 INR/kg on May–July Fridays (−7.52 on 13-May; proxy too low in the trough). Because the parity anchor is built on this proxy, it widens
    the open/closed swing between the spike and the trough. P1 should run the anchor on the mirror M1 as a sensitivity
    (still PROXY: third-party, unverified provenance) until MCX bhavcopy closes for 5 window dates are obtained.

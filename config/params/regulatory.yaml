# Owned by the Phase 0 regulatory/contract research agent. Research trail: docs/research/regulatory_contract_notes.md;
# status of every check: docs/verification_log.md. Indian customs, trade-policy and compliance parameters for
# HS 7602 (aluminium waste & scrap) over the Mar–Aug 2022 window (engine horizon to 30-Sep-2022).
#
# Primary-source cache (all retrieved 2026-09-16, never hand-edited):
#   data/raw/regulatory/cbic_notifications/      CBIC notification PDFs (decoded byte-for-byte from the portal API's base64 payload)
#   data/raw/regulatory/cbic_exchange_rates_2022/ CBIC fortnightly exchange-rate notifications, Feb–Sep 2022
# CBIC Tax Information Portal: https://taxinformation.cbic.gov.in/content-page/explore-notification ; PDFs are served by
# https://taxinformation.cbic.gov.in/api/cbic-notification-msts/download/<id>/ENG (anonymous token from
# /api/authenticate-token; the site omits its Sectigo intermediate certificate, so the fetch used certifi + the AIA
# intermediate http://crt.sectigo.com/SectigoPublicServerAuthenticationCAOVR36.crt — verification was NOT disabled).

# ---------------------------------------------------------------------------------------------------------------
# Customs duties on HS 7602 (landed-cost build, CONTRACTS §5)
# ---------------------------------------------------------------------------------------------------------------
bcd_scrap_hs7602:
  value: 0.025
  unit: frac_of_assessable_value
  flag: DIRECT
  source: >-
    Notification No. 50/2017-Customs dated 30-Jun-2017 (effective-rate notification), Table S.No. 385: chapter/heading
    '7602', description 'Aluminium scrap', standard rate '2.5%' (CBIC portal id 1002538; cached
    data/raw/regulatory/cbic_notifications/cs50-2017_principal.pdf). Budget amendments to 50/2017 checked for any
    change to S.No. 385 / 7602: 06/2018, 25/2019, 01/2020, 02/2021, 55/2021 (HSN-2022 alignment), 02/2022, 02/2023 —
    none touches it (cached in the same folder).
  verify: >-
    VERIFIED 2026-09-16 (rate in principal notification + no change in the Budget/HSN amendment notifications read).
    Residual gap: ~40 non-Budget amendments to 50/2017 (2017–2022) were listed but not individually opened; pages
    read on 2026-09-16 (The Tribune/ANI 08-Jul-2026 on the AAI representation,
    https://www.tribuneindia.com/news/aluminium-quality/aluminium-association-of-india-urges-centre-to-notify-bis-standards-for-aluminium-scrap,
    cached data/raw/regulatory/news/tribune_aai_urges_bis_standards_aluminium_scrap.html; AlCircle Apr-2026) still cite
    2.5% BCD on aluminium scrap, so an interim change and reversal is very unlikely.
  note: >-
    The seed's claim that 'Budget 2021-22 cut BCD on aluminium scrap to 2.5%' was WRONG — Budget 2021-22 cut copper
    scrap (7404) to 2.5%; aluminium scrap has been at 2.5% since at least the June-2017 GST-era re-issue of the
    effective-rate notification. Applies to both 7602 00 10 (ISRI-coded scrap) and 7602 00 90 (other) because S.No.
    385 is written at heading level. The 5-percentage-point gap to primary aluminium (bcd_primary_al_hs7601 = 7.5%)
    is the policy wedge that makes scrap-to-ingot conversion in India an arbitrage (see notes §1).

sws_rate_on_bcd:
  value: 0.10
  unit: frac_of_bcd
  flag: DIRECT
  source: >-
    Finance Act 2018 s.110(3): SWS 'at the rate of ten per cent' on the aggregate of duties, taxes and cesses levied
    under s.12 Customs Act, excluding safeguard/CVD/anti-dumping duty and SWS itself (text read at
    https://indiankanoon.org/doc/20129988/). IGST and GST compensation cess are exempted from SWS by Notification
    13/2018-Customs (portal title read, truncated after 'from the whole o…'; text not opened). Exemption list Notification 11/2018-Customs (cached
    cs11-2018_sws_exempt.pdf) and its 2020/2021/2022 amendments 09/2020, 14/2021, 03/2022, 24/2022 contain no chapter-76
    entry.
  verify: >-
    VERIFIED 2026-09-16 (statute text + exemption notifications read; no aluminium scrap exemption). Not re-checked:
    amendments to 11/2018 issued outside Budget days.
  note: >-
    With BCD 2.5% and no AIDC, SWS = 0.25% of assessable value, so BCD + SWS = 2.75% of AV on scrap versus 8.25% on
    primary aluminium.

aidc_scrap_hs7602:
  value: 0.0
  unit: frac_of_assessable_value
  flag: DIRECT
  source: >-
    Notification No. 11/2021-Customs dated 01-Feb-2021 (effective rates of Agriculture Infrastructure and
    Development Cess; cached cs11-2021_aidc.pdf) lists no chapter-76 goods. 2022 amendments to 11/2021 seen on the
    CBIC portal (16/2022, 27/2022, 44/2022, 53/2022, 60/2022) concern edible oils, cotton, anthracite, platinum and
    similar items (titles only).
  verify: "VERIFIED 2026-09-16 for the principal notification; the 2022 amendments were checked by title, not opened."
  note: "AIDC was never levied on aluminium scrap in the window, so SWS base = BCD only."

igst_rate_hs7602:
  value: 0.18
  unit: frac_of_av_plus_customs_duty
  flag: DIRECT
  source: >-
    Notification No. 1/2017-Integrated Tax (Rate) dated 28-Jun-2017, Schedule III (18%), S.No. 263: '7602 Aluminium
    waste and scrap' (CBIC portal id 1001202; cached igst01-2017_rate.pdf). Amendments 14/2021-IT(R) (w.e.f.
    01-Jan-2022) and 01/2022-IT(R) (31-Mar-2022) read — neither touches S.No. 263.
  verify: "VERIFIED 2026-09-16 (principal schedule + the two amendments in force around the window)."
  note: >-
    IGST base = AV + BCD + SWS (Customs Tariff Act s.3 — IGST charged on value plus customs duties; subsection text not re-fetched). Primary aluminium 7601 is in the same Schedule III
    (S.No. 262), so IGST is neutral between the scrap and primary routes.

igst_credit_lag_days:
  value: 45
  unit: days
  flag: ASSUMPTION
  source: "Desk construction: IGST is paid with the Bill of Entry (~1 day after arrival) and recovered as input tax credit when the GSTR-3B for the month of the domestic sale is filed (20th of the following month); for a sale ~10 days after arrival that is ~40–50 days"
  verify: "N/A — cash-cycle assumption (GSTR-3B due date rule stated from CGST Rules r.61, not re-fetched)"
  note: "Used ONLY for the IGST financing line in CONTRACTS §5 (igst_finance_inr_t); IGST itself is not a landed cost while igst_itc_available is true. At 18% × ~INR 2.3 lakh × 45/365 × 9.5–10% ≈ INR 500/t."

igst_itc_available:
  value: true
  unit: bool
  flag: ASSUMPTION
  source: "Desk assumption: GST-registered importer re-selling taxable goods claims full ITC on IGST paid on the Bill of Entry"
  verify: "N/A — structural assumption (legal basis: Bill of Entry is an ITC document under CGST Rules r.36(1)(d); rule text not re-fetched)"
  note: >-
    When true, import IGST is excluded from landed cost; only its financing from the Bill of Entry to the GSTR-3B
    offset is kept (igst_credit_lag_days, CONTRACTS §5 igst_finance_inr_t). Real-world caveat: ITC is
    cash-neutral only after the output invoice; a desk with thin domestic output tax liability can carry a
    blocked-credit balance — that is a working-capital cost, not a P&L cost.

bcd_primary_al_hs7601:
  value: 0.075
  unit: frac_of_assessable_value
  flag: DIRECT
  source: >-
    Customs Tariff Act 1975, First Schedule tariff rate for heading 7601 = 7.5% (search summaries attribute the
    5% -> 7.5% increase to Budget 2016-17; no Budget-2016 document was retrieved). Notification 50/2017-Customs
    (principal, cached) has no 7601 concession, and the 2018–2023 Budget amendments read (see bcd_scrap_hs7602)
    contain no 7601 entry, so the tariff rate applied in 2022. AlCircle (Apr-2026,
    https://www.alcircle.com/news/can-india-sustain-8-25-aluminium-duties-when-55-of-demand-is-imported-118251, read
    2026-09-16): 'Primary aluminium under HS 7601 is charged at 8.25 per cent, scrap under HS 7602 at 2.5 per cent'
    (8.25% = 7.5% BCD × 1.10 SWS).
  verify: >-
    PARTIAL 2026-09-16 — chain of evidence is consistent but the 2022 First Schedule page for chapter 76 itself was
    not retrieved. Next step: download the Customs Tariff chapter 76 as amended by the Finance Act 2022 (CBIC Tax
    Information Portal > Acts > Customs Tariff Act) and read tariff items 7601 10 10–7601 20 90.
  note: >-
    Used only for the MCX import-parity proxy (MCX Aluminium is priced duty-paid; market_proxy.yaml calibrates
    mcx_domestic_premium_inr_kg on this rate).

landing_charges_frac:
  value: 0.0
  unit: frac_of_cif
  flag: DIRECT
  source: >-
    Notification No. 91/2017-Customs (N.T.) dated 26-Sep-2017, Customs Valuation (Determination of Value of Imported
    Goods) Amendment Rules 2017, substituting Rule 10(2) (CBIC portal id 1006196; cached
    csnt91-2017_valuation_amend.pdf). The substituted rule includes transport, loading, unloading and handling
    charges 'to the place of importation' at actual and contains no deemed landing-charge percentage.
  verify: "VERIFIED 2026-09-16 (amendment text read; in force throughout 2022)."
  note: >-
    The pre-2017 Rule 10(2) added a deemed 1% of CIF for landing charges; that addition no longer exists, so AV =
    CIF (ocean freight and insurance at actual). Destination THC/CFS/DO after arrival are NOT in AV — they sit in
    port_cf_charges_inr_t_* (logistics.yaml). Fallbacks written into the same rule: freight not ascertainable =>
    20% of FOB; insurance not ascertainable => 1.125% of FOB (see customs_deemed_* below).

customs_deemed_freight_frac_fob:
  value: 0.20
  unit: frac_of_fob
  flag: DIRECT
  source: "Notification 91/2017-Customs (N.T.), substituted Rule 10(2), first proviso (cached csnt91-2017_valuation_amend.pdf)"
  verify: "VERIFIED 2026-09-16 (text read)"
  note: "Only applies when actual freight is not ascertainable (e.g., an FOB contract with undocumented freight). Not used in the base parity, which uses actual/proxy freight."

customs_deemed_insurance_frac_fob:
  value: 0.01125
  unit: frac_of_fob
  flag: DIRECT
  source: "Notification 91/2017-Customs (N.T.), substituted Rule 10(2), third proviso (cached csnt91-2017_valuation_amend.pdf)"
  verify: "VERIFIED 2026-09-16 (text read)"
  note: >-
    Customs-valuation fallback when the insurance cost is not ascertainable. It is ~10x the commercial premium
    (insurance_rate, logistics.yaml), so an importer who cannot evidence the actual premium pays duty on a larger AV:
    ~1.1% × 2.75% ≈ 0.03% of FOB extra duty — immaterial, but a real compliance point.


customs_usdinr_import:
  path:
    - [2022-02-18, 76.05]   # 10/2022-Cus(NT) dated 17-Feb-2022
    - [2022-03-04, 76.65]   # 13/2022-Cus(NT) dated 03-Mar-2022
    - [2022-03-18, 76.90]   # 18/2022-Cus(NT) dated 17-Mar-2022
    - [2022-04-08, 76.80]   # 32/2022-Cus(NT) dated 07-Apr-2022
    - [2022-04-22, 77.15]   # 34/2022-Cus(NT) dated 21-Apr-2022
    - [2022-05-06, 77.05]   # 40/2022-Cus(NT) dated 05-May-2022
    - [2022-05-20, 78.60]   # 43/2022-Cus(NT) dated 19-May-2022
    - [2022-06-03, 78.50]   # 49/2022-Cus(NT) dated 02-Jun-2022
    - [2022-06-17, 78.95]   # 51/2022-Cus(NT) dated 16-Jun-2022
    - [2022-07-08, 79.90]   # 58/2022-Cus(NT) dated 07-Jul-2022
    - [2022-07-22, 80.95]   # 64/2022-Cus(NT) dated 21-Jul-2022
    - [2022-08-05, 80.25]   # 66/2022-Cus(NT) dated 04-Aug-2022
    - [2022-08-19, 80.50]   # 70/2022-Cus(NT) dated 18-Aug-2022
    - [2022-09-02, 80.45]   # 73/2022-Cus(NT) dated 01-Sep-2022
    - [2022-09-16, 80.40]   # 78/2022-Cus(NT) dated 15-Sep-2022 (in force to 06-Oct-2022)
  interp: step
  unit: inr_per_usd
  flag: DIRECT
  source: >-
    CBIC exchange-rate notifications under s.14 Customs Act, Schedule I 'US Dollar — (a) For Imported Goods', each
    effective the day after issue as stated in its text (cached data/raw/regulatory/cbic_exchange_rates_2022/csnt<N>-2022.pdf,
    listed on https://taxinformation.cbic.gov.in/content-page/explore-notification, Customs > Non Tariff > 2022).
  verify: >-
    VERIFIED 2026-09-16 — all 15 USD-changing notifications Feb–Sep 2022 read. The interleaved amendments 16/2022,
    36/2022, 38/2022, 42/2022, 53/2022, 54/2022, 83/2022 and 85/2022 were also read: they change only Turkish lira,
    Norwegian krone, rand, Swiss franc or sterling, never the USD rate.
  note: >-
    Assessable value in INR = CIF USD × the import rate in force on the Bill of Entry date (s.14 read with s.46/s.15
    Customs Act; the rate on the date of filing the BoE applies — rule stated from the Act, not re-fetched). Import −
    export = INR 1.70 in 13 of the 15 notifications and INR 1.75 in 64/2022 (80.95 / 79.20) and 73/2022 (80.45 / 78.70)
    (corrected after review; all 15 import values re-read from the cached PDFs). Values before 18-Feb-2022 clamp to
    76.05 (not in window). CONTRACTS §5 uses this rate ONLY for the duty base (av_customs_inr_t); the goods themselves
    are paid at the market rate.

customs_fx_markup_frac:
  value: 0.011
  unit: frac_of_market_usdinr
  flag: PROXY
  source: >-
    Computed in-repo 2026-09-16: customs_usdinr_import ÷ market USDINR (data/processed/fx_rates_daily.csv usdinr,
    ECB cross) on the last business day before each notification, 14 notifications 04-Mar-2022 → 16-Sep-2022:
    mean +1.11% (range +0.78% to +1.36%); versus the average market rate over each notification's validity period:
    mean +0.68% (range −0.53% to +1.88%).
  verify: "PARTIAL — the customs side is DIRECT; the market side is the ECB-cross PROXY, not the RBI reference rate."
  note: >-
    Use only as a fallback when a date falls outside customs_usdinr_import. Economic reading: the customs import rate
    is set roughly at market + ~₹0.85 and then frozen for a fortnight, so in a depreciating-INR fortnight (e.g.
    22-Jul-2022 validity, +1.88%) duty is computed on a stale-but-high rate, and in a sharp INR fall (e.g. 06-May,
    16-Sep validity) the importer briefly pays duty on a rate BELOW market.

# ---------------------------------------------------------------------------------------------------------------
# Import policy & compliance (DGFT / Customs / Mines) — structural facts
# ---------------------------------------------------------------------------------------------------------------
import_policy_hs7602:
  value: "Free, subject to DGFT HBP para 2.54 conditions (PSIC / designated ports / radiation checks) and NFMIMS registration"
  unit: text
  flag: DIRECT
  source: >-
    DGFT Public Notice No. 46/2015-2020 dated 14-Jan-2022 amending HBP 2015-20 para 2.54(d)(v)(iv) (text as
    reproduced at http://worldtradescanner.com/46-PN-14.01.2022.htm and summarised at
    https://www.bizsolindia.com/dgft-import-consignments-of-metallic-waste-and-scrap-both-shredded-and-unshredded-imported-from-safe-countries-region-i-e-the-usa-the-uk-canada-new-zealand-australia-and-the-eu-will-not-requ/);
    NFMIMS per DGFT Notification 61/2015-2020 dated 31-Mar-2021 (reported by TaxTMI/TeamLease/Taxscan secondary pages).
  verify: >-
    PARTIAL 2026-09-16 — PN 46 content read via two republishers, not the DGFT PDF itself; NFMIMS coverage of 7602
    read only from secondary pages. Next step: fetch the DGFT PDFs from https://www.dgft.gov.in/CP/?opt=public-notice
    and ?opt=notification (JS portal; use a browser) and read the ITC(HS) policy-condition text for 7602.
  note: "Structural input for the compliance narrative and the stress scenario; not a number in the parity formula."

psic_required_safe_origin_designated_port:
  value: false
  unit: bool
  flag: DIRECT
  source: "DGFT Public Notice 46/2015-2020 (14-Jan-2022), para 2.54(d)(v)(iv) as amended (see import_policy_hs7602)"
  verify: "PARTIAL — republisher text read (worldtradescanner, bizsolindia); DGFT original not fetched"
  note: >-
    Metallic scrap from USA, UK, Canada, New Zealand, Australia and the EU needs no PSIC when cleared at one of ten
    ports (Chennai, Tuticorin, Kandla, JNPT, Mumbai, Krishnapatnam, Mundra, Kattupalli, Hazira, Kamarajar), provided
    it carries a supplier/scrap-yard certificate of no radioactive material/explosives and passes portal-monitor
    radiation and container-scanner checks at the port. => the USEC_MUN lane (US origin into Mundra) needs no PSIC.

psic_required_uae_origin:
  value: true
  unit: bool
  flag: DIRECT
  source: "DGFT Public Notice 46/2015-2020 (14-Jan-2022): exemption limited to the six named safe origins; other origins remain subject to PSIC"
  verify: "PARTIAL — republisher text read; DGFT original not fetched"
  note: >-
    UAE is not a 'safe country', so Jebel Ali cargo into Nhava Sheva (JEA_NSA) needs a Pre-Shipment Inspection
    Certificate from a DGFT-recognised inspection agency (list at https://www.dgft.gov.in/CP/?opt=psia) even though
    JNPT is a designated port. Operational consequence: add PSIC cost and lead time to every Gulf fixture.

psic_cost_usd_per_box:
  value: 40.0
  unit: usd_per_box
  flag: ASSUMPTION
  source: "Desk assumption — no 2022 PSIA tariff was retrieved"
  verify: "PENDING — obtain an inspection-agency (PSIA) 2022 quote or published fee for radiation + explosives inspection of a 20ft scrap container at Jebel Ali"
  note: "≈ USD 1.6/MT at 25 MT/box — small but now included in CONTRACTS §5 port charges for non-safe origins (JEA_NSA), per review; material to operations (lead time ~2–4 days before stuffing/sailing)."

nfmims_registration_required:
  value: true
  unit: bool
  flag: DIRECT
  source: "DGFT Notification 61/2015-2020 dated 31-Mar-2021 (import policy of chapter-76 items changed to 'Free subject to compulsory registration under NFMIMS'); DGFT Policy Circular 42/2015-2020 dated 27-Jul-2022 clarifications (read at https://www.taxscan.in/dgft-clarifies-issues-relating-to-non-ferrous-metal-import-monitoring-system/194908)"
  verify: "PARTIAL — secondary sources only; whether 7602 00 10/90 are in the 43 covered chapter-76 lines is not confirmed from the DGFT annexure. Next step: read the annexure of Notification 61/2015-2020 on dgft.gov.in."
  note: >-
    Registration (automatic URN) must be filed no earlier than 60 days and no later than 5 days before expected
    arrival (secondary sources); the 27-Jul-2022 circular says one registration can cover multiple consignments
    within its validity and that NFMIMS does not apply to air freight.

nfmims_min_lead_days:
  value: 5
  unit: days_before_arrival
  flag: PROXY
  source: "Secondary descriptions of DGFT Notification 61/2015-2020 (IndiaFilings / TaxTMI summaries retrieved via search 2026-09-16)"
  verify: "PENDING — confirm 60/5-day window and 75-day validity in the DGFT notification text"
  note: "A late NFMIMS registration blocks the Bill of Entry — an avoidable demurrage trigger on the JEA_NSA lane where transit is only ~5 days."

bis_qco_scrap_in_force_2022:
  value: false
  unit: bool
  flag: DIRECT
  source: >-
    PIB release (01-Sep-2023, PRID 1954005, https://www.pib.gov.in/PressReleaseIframePage.aspx?PRID=1954005, cached
    data/raw/regulatory/news/pib_prid_1954005_mines_qco_non_ferrous.html): the Mines ministry QCOs notified 31-Aug-2023
    'mark the first technical regulations from Ministry of Mines under the BIS Act' and cover aluminium and alloy
    ingots/castings and EC-grade products, not scrap. Argus 'India scraps BIS norms on some metals' (14-Nov-2025,
    https://www.argusmedia.com/en/news-and-insights/latest-market-news/2754022-india-scraps-bis-norms-on-some-metals,
    cached argus_2754022_india_scraps_bis_norms_on_some_metals.html) and ELP Law 'BIS Update - Withdrawal of QCOs for
    certain metals' (https://elplaw.in/leadership/bis-update-withdrawal-of-qcos-for-certain-metals/, cached) report
    those QCOs withdrawn (announced 13-Nov-2025). The Tribune / ANI (08-Jul-2026,
    https://www.tribuneindia.com/news/aluminium-quality/aluminium-association-of-india-urges-centre-to-notify-bis-standards-for-aluminium-scrap,
    cached tribune_aai_urges_bis_standards_aluminium_scrap.html): the standard 'Aluminium & Aluminium Alloy Scrap -
    Requirements & Conditions of Delivery' 'has remained pending for more than two years'.
  verify: "VERIFIED 2026-09-16 — no BIS QCO applied to aluminium scrap in 2022 (PIB: the first Mines QCOs came in Aug-2023 and did not cover scrap); later status from Argus/ELP (withdrawal) and Tribune/ANI (scrap standard still pending). All four pages re-retrieved and cached on 2026-09-16 after review found two sources without URLs."
  note: >-
    So the 'BIS-QCO + demurrage' scenario (Table 6 row 4.2) is a hypothetical policy shock, not a replay of a 2022
    event. It is plausible because (i) the primary industry (AAI) has lobbied since 2022–23 for scrap standards and
    higher scrap duty, (ii) the Mines ministry did impose QCOs on primary aluminium within ~18 months of the window,
    and (iii) BIS standard IS 2066 (Part 1):2024 for scrap classification now exists. See notes §4.

qco_stress_delay_days:
  value: 21
  unit: days
  flag: ASSUMPTION
  source: "Desk scenario design; anchored on clearance_delivery_days range 7–21 (logistics.yaml) and on the 3-month notification-to-effect lag written into the 2023 Mines QCOs (PIB 01-Sep-2023)"
  verify: "N/A — scenario assumption"
  note: >-
    Extra port dwell per container while BIS licence / test-report paperwork is demanded at clearance for cargo
    already afloat when a scrap QCO bites. Applied on top of clearance_delivery_days and beyond free days, it drives
    demurrage via demurrage_usd_per_box_day and detention_free_days (logistics.yaml) plus 21 days' extra finance
    cost. 21 days ≈ one BIS sampling-and-test cycle plus a re-filing — a judgement, not an observation.

qco_stress_rejection_frac:
  value: 0.10
  unit: frac_of_shipment_mt
  flag: ASSUMPTION
  source: "Desk scenario design"
  verify: "N/A — scenario assumption"
  note: >-
    Share of affected tonnage refused clearance (non-conforming grade/contamination against a new BIS scrap
    standard) and re-exported or sold in bond. 10% reflects that ISRI-graded Taint/Tabor and Tense would largely
    conform while lower Zorba/mixed lots would not; a harsher 25% is a sensible sensitivity.

qco_stress_rejected_loss_frac:
  value: 0.15
  unit: frac_of_cif_value
  flag: ASSUMPTION
  source: "Desk scenario design"
  verify: "N/A — scenario assumption"
  note: >-
    Loss on each rejected tonne as a fraction of its CIF value: return/onward freight, re-export documentation,
    distressed resale discount to a third-country buyer. Combined with rejection 10% this is ~1.5% of cargo value
    before demurrage — deliberately smaller than the delay/demurrage leg, which is where 2023–2025 QCO frictions
    actually bit importers.

# --- Phase 7 sentiment overlay (owner: desk.sentiment.run — VADER on the real Google News RSS headlines, spec Table 7
# row 5.2; doc docs/70_sentiment_overlay.md). Appended below the sections above without editing them. Every key here
# was declared on 2026-09-16 BEFORE any sentiment-vs-LME correlation was computed, and none was revised after seeing
# one. The lead/lag range (-3..+3 weeks) and the 10,000 bootstrap draws are brief-fixed model-structure constants in
# desk/sentiment/run.py; the key price weeks come from outputs/tables/adverse_event_windows.csv (P3, reporting-only).

sent_vader_pos_threshold:
  value: 0.05
  unit: vader_compound_score
  flag: ASSUMPTION
  source: "vaderSentiment 3.3.2 README (Hutto & Gilbert, ICWSM 2014): the authors' recommended cut-off, compound >= 0.05 = positive"
  verify: "N/A — tool author's convention, adopted unchanged"
  note: >-
    A headline counts toward a week's pos_share when its VADER compound score is at least this value. Adopted from
    the tool's documentation rather than chosen, so the share cannot have been tuned to prices. Applied identically to
    the raw and the domain-adjusted score.

sent_vader_neg_threshold:
  value: -0.05
  unit: vader_compound_score
  flag: ASSUMPTION
  source: "vaderSentiment 3.3.2 README (Hutto & Gilbert, ICWSM 2014): compound <= -0.05 = negative"
  verify: "N/A — tool author's convention, adopted unchanged"
  note: >-
    A headline counts toward a week's neg_share when its compound score is at most this value; scores strictly between
    the two thresholds are neutral. Most commodity headlines contain no VADER lexicon word at all and score exactly
    0, so the neutral share is large and is published alongside.

sent_zscore_min_past_weeks:
  value: 4
  unit: weeks
  flag: ASSUMPTION
  source: "Desk modelling choice (docs/70_sentiment_overlay.md §2.4)"
  verify: "N/A — modelling choice"
  note: >-
    A week's z-score compares its mean score with the mean and standard deviation of ALL EARLIER weeks only
    (expanding window, the week itself excluded from the reference), and is left blank until at least four earlier
    weeks exist. Four is the smallest reference that gives a standard deviation any stability while leaving 24 of the
    28 weeks scored; it means no z-score exists for the weeks around the 7-Mar-2022 high, which the doc states rather
    than hides. No future week ever enters a z-score.

sent_signal_z_abs:
  value: 1.0
  unit: z_score_abs
  flag: ASSUMPTION
  source: "Desk modelling choice (docs/70_sentiment_overlay.md §2.6)"
  verify: "N/A — modelling choice, declared before any lead test was run"
  note: >-
    The episode lead test records SIGNAL FIRED for a price turn if, in one of the three W-FRI weeks ending on or before
    the last close before the move, the past-only z-score pointed in the direction of the coming move by at least one
    standard deviation. (Wording corrected after the first run to match the code, which was written before any
    result; the earlier wording, "the three complete weeks before the week of the turn", is published as
    verdict_alt_window in sentiment_episodes.csv and gives the same verdicts.) One sigma is deliberately loose (a
    lenient test gives sentiment every chance); the table therefore also publishes the base rate, i.e. how often the
    same condition fired in all other weeks, without which a single hit means nothing.

sent_bootstrap_block_weeks:
  value: 3
  unit: weeks
  flag: ASSUMPTION
  source: "Desk modelling choice; moving-block bootstrap (Kunsch 1989) because weekly sentiment and returns are autocorrelated"
  verify: "N/A — modelling choice"
  note: >-
    Block length of the moving-block bootstrap behind the lead/lag correlation intervals. Resampling single weeks
    would treat autocorrelated weekly scores as independent and give intervals that are too narrow; three weeks is
    roughly n^(1/3) for n = 28 (the usual rate for block length) and matches the +/-3-week lag range.

sent_domain_valence_abs:
  value: 1.5
  unit: vader_valence_points
  flag: ASSUMPTION
  source: "vaderSentiment 3.3.2 vader_lexicon.txt: mean absolute valence of its 7,506 entries is 1.54 (median 1.6)"
  verify: "N/A — computed from the installed lexicon file, rounded down"
  note: >-
    The single valence (+1.5 bullish, -1.5 bearish) given to every word in sent_domain_lexicon. One magnitude for all
    words, set at the lexicon's typical word strength, so no individual weight could be tuned; rounded DOWN so a domain
    word never outweighs a typical VADER word.

sent_domain_lexicon:
  value:
    up: [surge, surges, surged, surging, soar, soars, soared, soaring, jump, jumps, jumped, rally, rallies, rallied,
         rallying, rise, rises, rose, rising, climb, climbs, climbed, climbing, rebound, rebounds, rebounded, bullish,
         deficit, deficits, shortage, shortages, tight, tighter, tightness]
    down: [slump, slumps, slumped, plunge, plunges, plunged, plunging, tumble, tumbles, tumbled, fall, falls, fell,
           slide, slides, slid, decline, declines, declined, declining, sink, sinks, sank, slip, slips, slipped, dip,
           dips, dipped, drops, dropped, crashes, crashed, plummet, plummets, plummeted, bearish, glut, gluts, surplus,
           surpluses, oversupply, slowdown, soften, softens, softened, softer]
    neutral: [demand]
  unit: word_lists_price_direction
  flag: ASSUMPTION
  source: "Desk judgement from standard metals market-report vocabulary; declared 2026-09-16 before any correlation with LME was computed; per-word reasons in docs/70_sentiment_overlay.md §2.3"
  verify: "N/A — judgement; the doc publishes raw VADER next to the adjusted score so the adjustment can be ignored"
  note: >-
    A small PRICE-DIRECTION overlay on VADER, which is a general social-media lexicon: it has no entry for surge, soar,
    rally, rise, plunge, slump, tumble, fall, decline or glut, and scores deficit (-1.7) and shortage (-1.0) as bad
    news although in a metals headline they are bullish for price. Rules: (1) only words whose price direction is the
    same in nearly all market-report usage; (2) inflections listed explicitly because VADER does not stem; (3) add a
    word only if VADER lacks it, or overwrite it only if VADER gives it the wrong sign for price (deficit, shortage,
    shortages; deficits is simply absent) or a tone that is not a price direction (demand -0.5 -> 0); words VADER already signs
    the right way (gain, drop, crash, falling, low, lower, weak, strong) are left alone; (4) deliberately NOT added
    because their price direction is ambiguous: war, sanctions, crisis, cut(s), curbs, halt, closure, hike(s), ease,
    cool, recovery (also a recycling term), high, record, peak, tightening (monetary). The overlay assumes the subject
    of the verb is price, so "LME stocks fall" is mis-scored bearish; the doc counts such cases.

# Assumptions register for the Phase 4/5 risk pack (CONTRACTS §2: risk.yaml is owned by P4/P5).
# One section per owning stage. Each agent edits ONLY its own section; a later stage appends a new section below the
# last one, under its own "# --- ..." header, and never touches the keys above it. Keys are globally unique across
# config/params/*.yaml (desk.config raises on duplicates), so every key here carries its stage prefix.
#
# Model-structure constants (the 95 % confidence level, GARCH(1,1) order, zero-mean / Normal base choice) live in
# desk/risk/garch_var.py as named constants (CONTRACTS §1.6); the judgement calls a reviewer could reasonably
# change are below.

# --- Phase 4.1 VaR (owner: desk.risk.run_var — GARCH(1,1) vs historical-volatility VaR + Kupiec backtest) --------

var_garch_refit_frequency:
  value: W-FRI
  unit: pandas_period_alias
  flag: ASSUMPTION
  source: "Desk modelling choice (docs/40_var_garch.md §2.2)"
  verify: "N/A — modelling choice, nothing external to verify against"
  note: >-
    GARCH(1,1) parameters are re-estimated once per week (weeks ending Friday, the project calendar convention in
    CONTRACTS §3) on an expanding sample of every return dated strictly before the first panel day of that week.
    Inside the week the parameters are held and the variance recursion is filtered daily, so the forecast for day t
    always uses returns dated t-1 or earlier. Weekly rather than daily refits keep the run light on this 8 GB machine;
    with 250+ observations one extra week moves the estimates very little, whereas the daily filter carries the
    information that matters (yesterday's squared return).

var_garch_min_estimation_obs:
  value: 250
  unit: trading_days
  flag: ASSUMPTION
  source: "Desk modelling choice; roughly one year of LME trading days (docs/40_var_garch.md §2.2)"
  verify: "N/A — modelling choice"
  note: >-
    No GARCH forecast is produced until the expanding sample holds at least this many daily returns. With the
    lookback starting at HISTORY_START (2018-01-02) the first forecast falls on the last days of December 2018, so the
    2019-2022 unit-exposure backtest starts with every method available. One year is the smallest sample on which a
    three-parameter GARCH is usually identified; the 2018-only USD/INR fit still hits the alpha = 0 / beta = 1
    boundary, which var_garch_params.csv flags on every affected refit.

var_hist_window_base_days:
  value: 250
  unit: trading_days
  flag: ASSUMPTION
  source: "Basel market-risk convention of an (at least) one-year observation period for VaR; desk modelling choice"
  verify: "N/A — declared before any Phase 4 result was computed (2026-09-16)"
  note: >-
    The BASE 'simple historical volatility' against which GARCH is compared: the root-mean-square of the last 250
    daily returns ending the day before the forecast date (zero mean, like the GARCH). Chosen ex ante as the
    one-year window a desk or regulator would use, NOT because it lags; var_hist_window_fast_days is published
    beside it in every table so a reader can see GARCH against a fast window too. Also the window for the freight
    and LME cash-3M spread volatilities, which are historical in both methods.

var_hist_window_fast_days:
  value: 60
  unit: trading_days
  flag: ASSUMPTION
  source: "Desk modelling choice (about one quarter of trading days)"
  verify: "N/A — declared before any Phase 4 result was computed (2026-09-16)"
  note: >-
    The fast historical window reported next to the base in every table, chart and Kupiec row. It is the honest
    counterpart to the base: a 60-day window reacts much faster than 250 days, so any GARCH lead measured against it
    is the conservative reading.

var_corr_window_days:
  value: 250
  unit: trading_days
  flag: ASSUMPTION
  source: "Desk modelling choice (docs/40_var_garch.md §2.4)"
  verify: "N/A — modelling choice"
  note: >-
    Rolling Pearson correlation of daily factor changes (LME cash log return, USD/INR log return, USEC freight log
    return, LME cash-3M spread change) over the 250 panel days ending the day before the VaR date. The SAME
    correlation matrix is used by both vol methods, so the GARCH-vs-historical comparison isolates the volatility
    forecast. Freight is assessed weekly and carried forward (CONTRACTS §3), so its daily correlations are attenuated;
    freight is immaterial to this book's VaR (docs/40 §4.2).

var_vol_alert_percentiles:
  value: [0.75, 0.90, 0.95]
  unit: frac_percentile
  flag: ASSUMPTION
  source: "Desk modelling choice for the lead/lag reading (docs/40_var_garch.md §5)"
  verify: "N/A — modelling choice; 0.90 is the base, the others are robustness rows"
  note: >-
    A method 'flags rising risk' on the first day its volatility forecast rises above the given percentile of ITS
    OWN forecasts over var_vol_alert_reference_period (a pre-2022 period, so the thresholds contain no 2022 data).
    Each method is measured against its own distribution because a 250-day window is smoother than GARCH and would
    otherwise be judged against a bar it can never reach. 0.90 is the base threshold quoted in the finding.

var_vol_alert_reference_period:
  value: ["2019-01-02", "2021-12-31"]
  unit: date_range_inclusive
  flag: ASSUMPTION
  source: "Desk modelling choice (docs/40_var_garch.md §5)"
  verify: "N/A — modelling choice"
  note: >-
    The three calendar years of forecasts that define each method's alert thresholds. Ends before 2022 so no
    threshold is informed by the February-March 2022 spike, the 7-March-2022 all-time high or the crash it is used
    to date.

var_lead_episodes:
  value:
    - ["LME_MARCH_SPIKE", "2022-01-03", "2022-03-31"]
    - ["LME_MAY_JULY_CRASH", "2022-04-01", "2022-07-15"]
  unit: name_start_end
  flag: ASSUMPTION
  source: "Reporting-only search windows around the dated events in outputs/tables/adverse_event_windows.csv"
  verify: "N/A — reporting convention; no VaR or backtest number depends on these windows"
  note: >-
    Where the lead/lag table looks for each method's first alert. Episode 1 runs up to and through the 7-Mar-2022
    all-time high; episode 2 runs from the start of April to the E1 trough (2022-07-15), which contains the E1 crash
    fortnight 2022-04-22 -> 2022-05-09. Like the P3 event windows these are drawn after the fact and are
    REPORTING-ONLY: they select which dates to describe, never an input to a forecast. If a method is already above
    its threshold when a window opens, the table reports the day that spell began instead of inventing a crossing.

var_unit_backtest_start:
  value: 2019-01-02
  unit: date
  flag: ASSUMPTION
  source: "Desk modelling choice (spec Table 6 row 4.1 asks for a Kupiec test; ~120 book days have low power)"
  verify: "N/A — modelling choice"
  note: >-
    First forecast date of the constant-exposure backtests, which run to PANEL_END (2022-12-30). These exist because
    120 book days cannot tell a good VaR from a bad one (Kupiec does not reject anything from 2 to 11 exceptions at
    n = 120); roughly 1,000 days of a fixed exposure narrow that band to 38-64 exceptions against 50.5 expected.

var_unit_lme_mt:
  value: 1000.0
  unit: mt
  flag: ASSUMPTION
  source: "Desk modelling choice: a round long LME position, not a trade"
  verify: "N/A — modelling choice"
  note: >-
    Constant long LME aluminium cash position for the unit backtest. P&L on day t = qty x (cash_t - cash_t-1) x
    usdinr_t (the USD move converted at the day's rate); VaR = 1.645 x sigma_t x qty x cash_t-1 x usdinr_t-1. The
    size is irrelevant to exception counts; it only sets the rupee scale of the chart.

var_unit_fx_usd:
  value: 1000000.0
  unit: usd
  flag: ASSUMPTION
  source: "Desk modelling choice: a round long-USD position, not a trade"
  verify: "N/A — modelling choice"
  note: >-
    Constant long USD position against INR for the USD/INR unit backtest (the second GARCH series used in the book
    VaR). P&L = notional x (usdinr_t - usdinr_t-1); VaR = 1.645 x sigma_t x notional x usdinr_t-1.

# --- Phase 4.2 Monte Carlo (owner: desk.risk.run_mc — 10,000-path joint simulation, full revaluation, stress overlay)
# The estimation window itself is not a key: MASTER_SPEC Table 6 row 4.2 fixes it as the backtest window, which is
# WINDOW_START..WINDOW_END in desk/__init__.py. The path count (10,000) and the 95 % / 99 % levels are spec-fixed
# model-structure constants in desk/risk/monte_carlo.py. The freight +40 % shock is `freight_stress_shock_frac`
# (logistics.yaml) and the BIS-QCO stress uses `qco_stress_*` (regulatory.yaml): read, not duplicated here.

mc_horizon_bdays:
  value: 10
  unit: business_days
  flag: ASSUMPTION
  source: "Basel market-risk convention of a 10-business-day holding period; desk modelling choice (docs/41_monte_carlo.md §2.3)"
  verify: "N/A — declared before any Phase 4.2 result was computed (2026-09-16)"
  note: >-
    The base risk horizon: the covariance of daily factor changes is scaled by 10 (square root of time, no
    autocorrelation) and the book is re-marked instantaneously at the snapshot close with the clock, contracts and
    events held. Ten business days is roughly the time a physical desk needs to re-hedge or re-sell a cargo-sized
    position (an MCX hedge can be lifted in a day; a sale to a new smelter takes one to two weeks). A static-position
    "to settlement" horizon is also published, as a memo only, because the desk did not hold any snapshot position
    unchanged to settlement.

mc_pit_lookback_days:
  value: 126
  unit: trading_days
  flag: ASSUMPTION
  source: "Desk modelling choice: the number of daily returns in the spec's estimation window (2022-03-01..2022-08-31 has 126 LME days)"
  verify: "N/A — modelling choice"
  note: >-
    Length of the POINT-IN-TIME covariance sensitivity: the 126 daily changes dated on or before each snapshot date
    (and the complete W-FRI weeks inside that span for freight and the MCX basis). The spec's window covariance uses
    returns after an early snapshot (hindsight); this variant uses only what the desk knew at that close. Same length
    as the window so the two differ only in dating.

mc_student_t_dof:
  value: 5
  unit: degrees_of_freedom
  flag: ASSUMPTION
  source: "Desk modelling choice (docs/41_monte_carlo.md §2.4); common choice for commodity-return tails"
  verify: "N/A — modelling choice"
  note: >-
    Degrees of freedom of the multivariate Student-t sensitivity, scaled to the SAME covariance as the base normal
    (x = L z sqrt((nu-2)/chi2)). One chi-square per path scales all factors together: a normal whose variance is
    uncertain over the horizon. At equal variance nu = 5 puts the one-factor 95 % quantile 5 % BELOW the normal's,
    the 99 % quantile 12 % above it and the 99.9 % quantile 48 % above it.

mc_snapshot_rules:
  value:
    - ["ATH_PLUS_1", "first LME panel day after the window's highest LME cash close (the 7-Mar-2022 all-time high)"]
    - ["PEAK_GROSS_LME", "window day with the largest BOOK lme_delta_physical_mt in book_exposures_daily.csv"]
    - ["PEAK_BUYER_CONTRACTED", "first window day on which mc_buyer_default_buyer_id's contracted exposure (receivable + presettlement, buyer_credit_exposure_by_trade_daily.csv) is at its window maximum"]
  unit: id_rule
  flag: ASSUMPTION
  source: "Desk modelling choice, declared before any Phase 4.2 result was computed (2026-09-16); docs/41_monte_carlo.md §2.2"
  verify: "N/A — modelling choice"
  note: >-
    Three dates on which the book is revalued. Any date a rule selects that is an MCX exit or roll-out day
    (mcx_variation_margin.csv action exit|roll_out) moves to the next panel day that is not one, because the
    valuation at such a close still carries the exiting contract (docs/40_var_garch.md open issue 1). ATH_PLUS_1 is
    the spec's crash narrative (and the book's first day: T01 long, not yet hedged); PEAK_GROSS_LME is the most metal
    the desk ever carried, where hedge slippage matters most; PEAK_BUYER_CONTRACTED is the day the buyer-default
    stress has the most to bite on. The rules select dates from exposures and credit tables only, never from P&L.

mc_stress_lme_move_frac:
  value: -0.15
  unit: frac_of_lme_cash
  flag: ASSUMPTION
  source: "MASTER_SPEC_V3 Table 6 row 4.2 stress scenario 'LME -15%'"
  verify: "N/A — spec-defined scenario"
  note: >-
    Instantaneous LME cash x 0.85 (log shock ln 0.85), with MCX recomputed from the shocked cash at the held basis
    (unit beta, docs/30 §5.1). For scale: LME cash fell 12.95 % on 8-Mar-2022 alone.

mc_stress_usdinr_move_frac:
  value: 0.05
  unit: frac_of_usdinr
  flag: ASSUMPTION
  source: "MASTER_SPEC_V3 Table 6 row 4.2 stress scenario 'INR -5%'"
  verify: "N/A — spec-defined scenario"
  note: >-
    Convention: 'INR -5 %' is read as the quoted USD/INR rate rising 5 % (rupee depreciation; log shock ln 1.05) —
    the way an Indian desk quotes the move. Measured as the rupee's own USD value it is a 4.76 % fall; a 5 % fall in
    that measure would be USD/INR +5.26 %. The CBIC customs rate moves with the market rate (valuation.shock_state).

mc_buyer_default_buyer_id:
  value: BUY_RJK_01
  unit: counterparty_id
  flag: ASSUMPTION
  source: "Phase 1-3 fix log open item 1 (docs/reviews/phase1-3_fix_log.md §3): advance reliance 1.26x/1.53x/1.83x of a ₹120 m limit; contracted exposure peaks at 2.57x"
  verify: "N/A — scenario design"
  note: >-
    The buyer defaulted in the Table 6 'buyer default' stress. Chosen for performance exposure relative to its limit
    (the desk relies on its advances), not for the largest rupee exposure: BUY_MUN_01's contracted exposure peaks
    higher in rupees (₹750 m on a ₹650 m limit). The stress is run on every snapshot; where this buyer has no open
    flow the scenario is zero and says so.

mc_buyer_default_recovery_frac:
  value: 0.25
  unit: frac_of_receivable
  flag: ASSUMPTION
  source: "Desk judgement: unsecured operational creditor of a defaulted small foundry (SIM)"
  verify: "PENDING — compare with published realisation rates for operational creditors in Indian insolvency resolutions (IBBI quarterly newsletter)"
  note: >-
    Recovery on cargo already RELEASED to the buyer when it defaults (an unsecured trade receivable, no retention of
    title assumed). Operational creditors rank behind secured lenders and typically recover a small fraction, late;
    0.25 is a judgement, so mc_buyer_default_recovery_sensitivity_frac publishes the 0 and 0.5 cases beside it.

mc_buyer_default_recovery_sensitivity_frac:
  value: [0.0, 0.5]
  unit: frac_of_receivable
  flag: ASSUMPTION
  source: "Desk modelling choice"
  verify: "N/A — sensitivity grid"
  note: >-
    Memo rows of the buyer-default scenario at these recoveries on released cargo (retained cargo is unaffected).

mc_buyer_default_resale_discount_frac:
  value: 0.05
  unit: frac_of_replacement_value
  flag: ASSUMPTION
  source: "Desk judgement: distressed resale of an imported scrap lot to another Gujarat smelter within weeks"
  verify: "N/A — scenario assumption (no public quote for distressed domestic scrap resales)"
  note: >-
    Cargo NOT yet released when the buyer defaults stays with the desk and is resold at the unsold-cargo mark
    (import replacement value, CONTRACTS §7a.1.3) less this discount. The loss is the lost contract receipts minus
    those resale proceeds, floored at zero (no windfall from a default). Extra storage while re-selling is not
    modelled.

mc_qco_uncleared_only:
  value: true
  unit: bool
  flag: ASSUMPTION
  source: "Desk modelling choice; a clearance-stage BIS-QCO bites at the Bill of Entry (regulatory.yaml qco_stress_delay_days note)"
  verify: "N/A — modelling choice"
  note: >-
    Apply StressEvent('qco_hold') only to tickets on the book with at least one lot not yet released at the snapshot.
    The API charges extra dwell on every box of a ticket and writes off the rejected fraction of its unsold (or, if
    all sold, whole) tonnage regardless of lot status; applied to already-cleared tickets that overstates the policy
    stress, so the all-tickets figure is published only as a memo row.

# --- Phase 5 liquidity & policy (owner: desk.risk.run_liquidity — margin & liquidity, Table 6 row 4.5, and the risk

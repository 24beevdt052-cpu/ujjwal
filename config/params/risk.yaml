# Appended below the sections above without editing them. `liq_` keys size the facilities and the margin stress;
# `policy_` keys are the limits the (SIM) head of desk proposes in outputs/reports/risk_policy_memo.md. Every policy
# note quotes the book evidence it was set against; the memo prints where the 2022 book would have breached it.

liq_plan_parity_week_end:
  value: "2022-02-25"
  unit: date
  flag: ASSUMPTION
  source: "Desk modelling choice: the last Phase 1 parity week before WINDOW_START (outputs/tables/parity_weekly.csv)"
  verify: "N/A — modelling choice"
  note: >-
    The facilities are sized as a bank would size them at sanction — before the window opened, on the prices and
    cash-cycle economics visible then: the six grade x lane cases of the parity week ending 2022-02-25. Nothing dated
    after that week enters the sizing. Carried caveat: that week's grade factor and freight level are Phase 1
    hindsight reconstructions (CONTRACTS §4.3), so the plan cost per tonne is itself partly reconstructed;
    margin_liquidity_limit_grid.csv shows the result at other facility sizes.

liq_plan_throughput_mt_pa:
  value: 30000.0
  unit: mt_per_year
  flag: ASSUMPTION
  source: "Desk plan read from MASTER_SPEC_V3 Table 4 (8-10 trades of 1,000-5,000 MT over the six-month window)"
  verify: "N/A — business-plan assumption"
  note: >-
    A first-year desk planning at the lower middle of the spec's range (about 9 parcels of ~1,700 MT a half-year)
    budgets ~15,000 MT per half-year, i.e. 30,000 MT a year (2,500 MT a month). Taken from the spec range, not from the
    book: the realised book (14,350 MT contracted Mar-Aug, ~2,390 MT a month) came in about 4 % under it, so the
    facility test is about the book's cash TIMING (usance maturities, IGST, buyer credit bunching), not its volume.

liq_plan_lc_tenor_days:
  value: 60
  unit: days
  flag: ASSUMPTION
  source: "Desk construction from lc_open_days_before_laycan_min (commercial.yaml), sight payment ~7 days after B/L, and 60-90 day usance"
  verify: "N/A — plan assumption"
  note: >-
    Average days one parcel's import LC sits on the non-fund limit in the plan. A sight LC is outstanding from opening
    (at least 10 days before the laycan) to document payment about 7 days after the B/L, roughly 25-30 days; a usance
    LC adds its 60-90 days. A plan that puts about a third of parcels on 90-day usance averages ~60 days. The book
    used usance on 3 of 9 parcels (T02 90 d, T05 60 d, T09 60 d).

liq_facility_rounding_inr:
  value: 250000000.0
  unit: inr
  flag: ASSUMPTION
  source: "Desk convention: sanctioned limits are round numbers"
  verify: "N/A — convention"
  note: >-
    Each plan requirement is rounded UP to the next ₹25 crore (₹250 m) to give the sanctioned limit. Rounding can only
    add headroom: on the 2022-02-25 plan it adds ₹30.2 m to the fund-based line and ₹126.8 m to the LC line.

liq_fb_wc_limit_inr:
  value: 1000000000.0
  unit: inr
  flag: ASSUMPTION
  source: "Desk construction: liq_plan_throughput_mt_pa x mean over the plan week's six parity cases of (finance_inr_t + igst_finance_inr_t) / wc_rate_inr_pa, rounded up by liq_facility_rounding_inr"
  verify: "PENDING — no 2022 sanction letter for a comparable importer was retrieved. Next step: a listed Indian non-ferrous metals trader's FY2022-23 annual report (sanctioned fund-based working-capital limits against turnover)."
  note: >-
    Sanctioned fund-based working-capital limit (cash credit / WCDL / import loans on one line) — the line Phase 3's
    funding accrual already assumes (CONTRACTS §7a.5) but never capped. Rule: 30,000 MT/yr x ₹32,326 of funded
    rupee-years per tonne (Phase 1's own finance_inr_t + igst_finance_inr_t at the 9.50 % plan rate) = ₹969.8 m
    average funded balance, rounded up to ₹1,000 m (₹100 crore); margin_liquidity_facility.csv recomputes it and a
    test asserts the registered value equals the rule. It is a sanction on the plan's AVERAGE balance, as a
    holding-period assessment would give; a parcel business is lumpy, and the buffer below plus an ad-hoc limit are
    what a bank expects to carry peaks. It was not set from the book's realised peak funding need.

liq_nfb_lc_limit_inr:
  value: 1000000000.0
  unit: inr
  flag: ASSUMPTION
  source: "Desk construction: liq_plan_throughput_mt_pa x mean plan-week CIF value per tonne (cif_usd_t x usdinr) x liq_plan_lc_tenor_days / 365, rounded up by liq_facility_rounding_inr"
  verify: "PENDING — as liq_fb_wc_limit_inr"
  note: >-
    Non-fund import LC limit (sight and usance credits outstanding). Rule: 30,000 MT/yr x ₹177,064 CIF per tonne x
    60/365 = ₹873.2 m average LC outstanding, rounded up to ₹1,000 m. The book's LC outstanding is valued at the
    trade-date planned purchase value x (1 + the ticket's LC tolerance), converted at each day's USD/INR (PROXY).

liq_min_cash_buffer_frac_of_fb_limit:

# Owned by the Phase 0 regulatory/contract research agent. Commercial economics of the desk: conversion cost, domestic
# price anchor, margin hurdle, trade-finance (LC) costs, SPA quality terms and domestic credit norms.
# Research trail: docs/research/regulatory_contract_notes.md §9–10.
#
# Key public evidence used (all read 2026-09-16):
#   [SBI22]  State Bank of India 'Schedule of Forex Transactions Related Service Charges', revised charges w.e.f.
#            01-Apr-2022 (https://sbi.bank.in/documents/16012/12924450/210222-Forex+Transactions+Related+Service+Charges+w.e.f.+01.04.2022+-+Notice+for+Customers.pdf/bb330c64-337a-b951-6ce4-bfd3b1d3bd6d?t=1645435603197;
#            cached data/raw/regulatory/banks/sbi_forex_service_charges_wef_2022-04-01.pdf)
#   [CRISIL] 'Assessment of secondary aluminium industry in India', CRISIL Research, Sept 2021, as published by CMR
#            (https://www.cmr.co.in/wp-content/uploads/2022/02/Assessment-of-secondary-aluminium-industry-in-India_03092021.docx.pdf;
#            cached data/raw/regulatory/cmr/Assessment-of-secondary-aluminium-industry-in-India_03092021.pdf)
#   [BM-Feb24] AlCircle/BigMint 24-Feb-2024 'Raw material costs propel India's aluminium ADC12 prices upward W-o-W'
#            (https://www.alcircle.com/news/raw-material-costs-propel-india-s-aluminium-adc12-prices-upward-w-o-w-108017)
#   [BM-Dec24] AlCircle/BigMint 05-Dec-2024 'India: ADC12 aluminium alloyed ingot prices remain rangebound'
#            (http://www.alcircle.com/news/press-release/india-adc12-aluminium-alloyed-ingot-prices-remain-rangebound-112726)
#   ECB EUR/INR and EUR/USD reference rates for the 2024 cross-checks: data/raw/regulatory/ecb/

# ---------------------------------------------------------------------------------------------------------------
# Conversion, anchor and hurdle (CONTRACTS §5)
# ---------------------------------------------------------------------------------------------------------------
conversion_cost_inr_t:
  value: 12000
  unit: inr_per_mt_ingot
  flag: ASSUMPTION
  source: >-
    Desk toll-conversion charge per tonne of secondary alloy INGOT produced (fuel, power, flux/salt, alloying top-up,
    labour, dross handling, overheads and the converter's margin), triangulated from BigMint/AlCircle 24-Feb-2024
    (https://www.alcircle.com/news/raw-material-costs-propel-india-s-aluminium-adc12-prices-upward-w-o-w-108017):
    ADC12 INR 204,000/t vs domestic Tense INR 172,500/t ex-Delhi; 1 t of ingot needs ~1/0.90 = 1.11 t of Tense
    (INR 191,700), leaving INR ~12,300/t of ingot; the Dec-2024 non-OEM / OEM prints (INR 201,000 / 209,000) give
    ~INR 9,000–17,000/t of ingot. Range INR 8,000–18,000 per t of INGOT.
  verify: "PENDING — no 2022 Indian secondary-smelter cost disclosure retrieved. Next step: cost-of-production note in a listed Indian secondary aluminium producer's 2022 annual report/DRHP (power + fuel + consumables per tonne)."
  note: >-
    UNIT FIX (review): the evidence is per tonne of ingot, so the unit is inr_per_mt_ingot and CONTRACTS §5 converts it
    per MT of scrap as conversion_inr_t = conversion_cost_inr_t × recovery_frac_g (e.g. INR 10,760/t of Tense scrap at
    0.897 recovery; lower for Zorba, which yields less ingot per tonne). Uniform across grades by design: (i) Zorba's
    heavies separation cost is netted inside heavies_net_value_frac_of_lme_al; (ii) Taint/Tabor's silicon top-up to
    ADC12 chemistry costs roughly nothing net, because silicon 553 (~USD 2,030/t CIF Mundra in the same 24-Feb-2024
    article) was priced below the alloy it becomes part of; (iii) melt-shop differences are inside the 8–18k range.
    Cross-check with [CRISIL] (Sept 2021): scrap = 80–85% of total cost incl. taxes and duties, i.e. a 15–20% non-scrap
    cost base (~INR 30–40k/t of ingot, part non-cash: depreciation, finance, selling) — a broader base than a toll
    charge; P1 runs it as the upper sensitivity (conversion_cost_sensitivity_inr_t_ingot).

conversion_cost_sensitivity_inr_t_ingot:
  value: [8000, 12000, 18000, 30000]
  unit: inr_per_mt_ingot
  flag: ASSUMPTION
  source: "conversion_cost_inr_t range (8–18k, 2024 spreads) plus a CRISIL-consistent upper case (~15% non-scrap cost on ~INR 200k/t ingot)"
  verify: "N/A — sensitivity grid"
  note: "P1 must report window_open for each value (named sensitivity)."

domestic_anchor_premium_inr_t:
  value: -9000
  unit: inr_per_mt
  flag: ASSUMPTION
  source: >-
    Median of 15 dated BigMint ADC12 ex-Delhi prices (01-Dec-2023 → 11-Dec-2025, republished by AlCircle; OEM-approved
    prints moved to a non-OEM basis by the INR 8,000 OEM − non-OEM gap in the 05/11-Dec-2024 articles) minus duty-paid
    LME CASH parity on the day before publication: LME cash (Westmetall) × ECB USD/INR × (1 + 7.5% × 1.10). Median
    −8,955 → −9,000; mean −16,422; range −52,068 … +12,861 (data/interim/price_evidence/adc12_vs_duty_paid_parity.csv,
    exact sentences in desk/data/fetch_price_evidence.py).
  verify: "PENDING — no 2022 ADC12/LM6 India price series was retrievable (AlCircle/BigMint 2022 archives not found in public). Next step: weekly 2022 ADC12 ex-Delhi/Chennai from BigMint or an automaker's 2022 monthly alloy settlement prices, compared with MCX near-month."
  note: >-
    REVIEW FIXES. (1) Basis: recalibrated against duty-paid LME CASH parity — the basis of the panel's MCX proxy that
    CONTRACTS §5 adds this premium to — instead of 3M (cash–3M basis in the sample: median INR ~4,100/t; M1 carry
    adds a further 0–1,300/t, not modelled). (2) Evidence: the previous −18,000 was the mean of two points computed
    with the articles' own LME figures (the 24-Feb-2024 point used 3M $2,247; Westmetall 3M on 23-Feb-2024 was $2,197).
    (3) Regime dependence is strong: correlation of the premium with parity −0.93; OLS short-run pass-through of
    parity into ADC12 = 0.15 (domestic_anchor_passthrough_frac). Premiums were +5k…+13k at parity ~191–205k (H1-2024)
    and −34k…−52k at parity ~235–276k (late 2024–25). The 2022 window's parity ran ~200–330k, so a constant premium
    overstates the anchor at the March spike and understates it in July–August. P1 must publish window_open as a band
    over domestic_anchor_premium_sensitivity_inr_t and under the sticky variant (domestic_anchor_trailing_bdays), not
    as a single flag. (4) CRISIL (Sept 2021, cached CMR PDF) says 'Secondary aluminium continues to be 25-30% cheaper
    than primary aluminium' with no date, product or price basis; against the dated 2023–25 ADC12 prints (−20% … +7%
    of parity) it reads as a cost or low-grade-product statement and is kept only as the low-end sensitivity (−55,000
    ≈ 25% of the window-mean MCX proxy of INR ~222k/t), not rejected and not used as the base.

domestic_anchor_premium_sensitivity_inr_t:
  value: [-55000, -52000, -9000, 13000]
  unit: inr_per_mt
  flag: ASSUMPTION
  source: "CRISIL-consistent low case (−25% of ~INR 222k), evidence minimum (−52,068), base median, evidence maximum (+12,861), rounded"
  verify: "N/A — sensitivity grid built from the domestic_anchor_premium_inr_t evidence"
  note: "P1 publishes the parity window for each value."

domestic_anchor_passthrough_frac:
  value: 0.15
  unit: frac
  flag: PROXY
  source: "OLS slope of ADC12 (non-OEM basis) on duty-paid LME cash parity over the 15 dated 2023–25 observations (desk.data.fetch_price_evidence; intercept INR ~173k/t)"
  verify: "VERIFIED 2026-09-16 as a statistic of the cached evidence (n=15; one regime, not 2022)"
  note: "Evidence of stickiness only: within 2023–25 a INR 1 move in import parity moved secondary alloy ingot by ~INR 0.15. Do not extrapolate the intercept to 2022 (it reflects 2024 scrap costs)."

domestic_anchor_trailing_bdays:
  value: 120
  unit: lme_trading_days
  flag: ASSUMPTION
  source: "Sticky-anchor sensitivity: anchor = mean duty-paid cash parity (= MCX spot proxy) over the previous 120 LME days + domestic_anchor_premium_trailing_inr_t"
  verify: "N/A — sensitivity design, not a fit optimum: on the 2023–25 evidence the premium's std falls steadily with window length (INR 24.0k against spot parity, 18.3k at 90, 17.5k at 120, 15.5k at 250 days; data/interim/price_evidence/adc12_trailing_parity_dispersion.csv); 120 LME days (~6 months) is a judgement for scrap inventory plus contract lags"
  note: "Economic reading: alloy ingot is priced cost-plus off scrap bought weeks to months earlier, so it tracks a trailing average of import parity. In 2022 this variant shuts the March spike and opens the July–August trough — the opposite of the constant-premium base."

domestic_anchor_premium_trailing_inr_t:
  value: -2000
  unit: inr_per_mt
  flag: ASSUMPTION
  source: "Median of ADC12 (non-OEM basis) minus the 120-LME-day trailing mean of duty-paid cash parity over the same 15 observations: −2,071 → −2,000"
  verify: "N/A — sensitivity; same evidence as domestic_anchor_premium_inr_t"
  note: "Used only with domestic_anchor_trailing_bdays."

margin_threshold_inr_t:
  value: 5000
  unit: inr_per_mt_scrap
  flag: ASSUMPTION
  source: "Desk hurdle: minimum expected net margin per MT of scrap before a trade is allowed (Table 3 row 1.4)"
  verify: "N/A — risk-policy assumption"
  note: >-
    ≈ 2% of a ~INR 2.3 lakh/MT landed cost. Sized to cover: expected quality/weight claims under the SPA penalty
    schedule (~0.5–1% of value ≈ INR 1,200–2,300), residual MCX hedge noise over a ~6-week cash cycle (the anchor
    premium is unhedgeable, see domestic_anchor_premium_inr_t), a few days' demurrage on 25 MT boxes, and leaves
    ~INR 1,500–2,000 as return on risk capital. Opening a window below this is 'picking up pennies in front of a
    steamroller' given the LME daily moves of 4–12% seen in Mar-2022.


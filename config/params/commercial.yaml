# Trade finance (Table 4 row 2.6 — LC sight vs 60–90 day usance)
# ---------------------------------------------------------------------------------------------------------------
lc_opening_fee_frac_per_month:
  value: 0.0008
  unit: frac_of_lc_value_per_month
  flag: DIRECT
  source: "[SBI22] Import LC / Revolving LC issuance: revised charge '0.08% per month and part thereof. Minimum Charges Rs. 2,000/-' w.e.f. 01-Apr-2022 (was 0.18% for the first 3 months + 0.08% per additional month)"
  verify: "VERIFIED 2026-09-16 as SBI's published card rate for the window; a corporate's negotiated rate may be lower"
  note: "Charged on LC value for the validity period (shipment window + presentation period)."

lc_opening_fee_frac:
  value: 0.0024
  unit: frac_of_lc_value
  flag: PROXY
  source: "[SBI22] 0.08% per month × 3 months' LC validity (desk assumption for a 15-day laycan + sailing + 21-day presentation)"
  verify: "PARTIAL — rate VERIFIED from SBI card; 3-month validity is an assumption"
  note: "≈ USD 5.5/MT on a USD 2,300/MT cargo. Revolving LCs for a supply programme are charged the same per reinstatement."

lc_usance_fee_frac_per_month:
  value: 0.0007
  unit: frac_of_bill_value_per_month
  flag: DIRECT
  source: "[SBI22] Import LC 'Usance Charges': revised '0.07% per month and part thereof', minimum Rs 2,000, w.e.f. 01-Apr-2022"
  verify: "VERIFIED 2026-09-16 (SBI card rate)"
  note: "Commitment charge for the usance period of a usance LC, separate from the interest cost of the credit itself."

import_bill_commission_frac:
  value: 0.0012
  unit: frac_of_bill_value
  flag: DIRECT
  source: "[SBI22] 'Commission on Import Bills Collection (Under LCs or Without LC)': revised 0.12% of bill amount, minimum Rs 500 (+0.10% in lieu of exchange if FX not converted with SBI), w.e.f. 01-Apr-2022"
  verify: "VERIFIED 2026-09-16 (SBI card rate)"
  note: "Charged at bill retirement."

lc_confirmation_fee_pa:
  value: 0.005
  unit: rate_pa
  flag: PROXY
  source: "[SBI22] export-side 'LC Confirmation Charges based on the rating of LC issuing bank': AAA–AA 0.25% p.a.; A–Baa3/BBB 0.50% p.a.; Ba1–B3/BB/B and unrated 0.75% p.a."
  verify: "PARTIAL — this is SBI's price for confirming OTHER banks' LCs; the fee a UAE/US bank charges to confirm an Indian bank's LC was not retrieved"
  note: "Proxy uses the BBB band (Indian banks' sovereign-capped ratings). US yards selling Taint/Tabor often ask for confirmation; Gulf traders frequently accept an unconfirmed LC from a top Indian bank — so apply on USEC_MUN, optional on JEA_NSA."

usance_interest_spread_pa:
  value: 0.015
  unit: rate_pa_over_usd_benchmark
  flag: ASSUMPTION
  source: "Desk assumption for supplier's/buyer's credit pricing on a 60–90 day USD usance, over 6-month SOFR-type benchmark; bounded by trade_credit_aic_ceiling_spread_pa"
  verify: "PENDING — no 2022 buyer's-credit quote retrieved; check an Indian bank or buyer's-credit arranger's 2022 indicative pricing"
  note: "Usance cost in USD = (benchmark + spread) × days/360 on the bill value; compare with the INR working-capital line (wc_rate_inr_pa, rates.yaml) plus forward premium to choose sight vs usance."

trade_credit_aic_ceiling_spread_pa:
  value: 0.03
  unit: rate_pa_over_benchmark
  flag: DIRECT
  source: "RBI ECB/Trade Credit master direction as amended 08-Dec-2021: LIBOR replaced by 'any widely accepted interbank rate or alternative reference rate (ARR) of 6-month tenor'; all-in-cost ceiling for trade credits raised to benchmark + 300 bps (350 bps for LIBOR-transition cases), as summarised at https://www.argus-p.com/updates/updates/rbi-changes-to-all-in-cost-benchmark-and-ceiling-for-foreign-currency-ecbs-and-trade-credits/"
  verify: "PARTIAL — law-firm summary read; RBI circular text not fetched. Next step: read the RBI press release/circular of 08-Dec-2021 on rbi.org.in."
  note: "Regulatory cap on usance/buyer's credit all-in cost for the window; desk pricing sits well inside it."

# ---------------------------------------------------------------------------------------------------------------
# SPA quality terms (Table 4 row 2.2)
# ---------------------------------------------------------------------------------------------------------------
standard_moisture_franchise_frac:
  value: 0.01
  unit: frac_of_gross_weight
  flag: ASSUMPTION
  source: "Desk SPA template. ISRI 2022 non-ferrous guidelines set no general moisture franchise (fragmentizer grades must be 'dry'); weight deduction above a small franchise is the common scrap-contract practice"
  verify: "N/A — contract-design assumption"
  note: "Moisture above 1% (determined by joint surveyor on arrival, oven-dry method) is deducted 1:1 from invoice weight; below 1% no adjustment."

rejection_penalty_schedule:
  value:
    - {trigger: "moisture above franchise", measure: "joint survey, oven-dry", remedy: "weight deduction 1:1 for the excess"}
    - {trigger: "non-metallics / attachments above ISRI grade limit by up to 3 percentage points", measure: "joint survey, sample sort", remedy: "price discount of 1.5 × excess % on the whole lot"}
    - {trigger: "non-metallics above limit by more than 3 points, or wrong grade", measure: "joint survey", remedy: "buyer may reject the lot or renegotiate within 10 days of survey; seller bears re-export or storage costs"}
    - {trigger: "free zinc / magnesium / iron above ISRI limit (Zorba, fragmentizer grades)", measure: "lab analysis of drill/melt sample", remedy: "discount per agreed schedule, rejection if > 2× limit"}
    - {trigger: "radioactivity above natural background or explosive/sealed pressurised items", measure: "port portal monitor / PSIA certificate / AERB-notified agency", remedy: "outright rejection; all costs, re-export and liabilities for seller's account"}
  unit: list
  flag: ASSUMPTION
  source: "Desk SPA template built on ISRI 2022 grade limits (Taint/Tabor oil & grease ≤1%, Tense ≤2%, fragmentizer non-metallics ≤5%) and DGFT PN 46/2015-20 radiation/explosives conditions"
  verify: "N/A — contract-design assumption (no 2022 executed SPA available)"
  note: "Numbers in the schedule are design choices; the 1.5× discount multiplier is intentionally punitive so sellers do not dilute grade."

radioactivity_clause:
  value: >-
    Seller warrants the material is free of radioactive substances above natural background, explosives, closed
    or pressurised containers and arms/ammunition; each shipment carries the supplier/scrap-yard certificate
    required by DGFT HBP para 2.54 (safe-origin, designated port) or a PSIC from a DGFT-recognised inspection agency
    (all other cases). Any container flagged by the Indian port radiation portal monitor or found non-compliant is
    rejected; seller bears inspection, isolation, decontamination, re-export and regulatory costs and indemnifies
    buyer against penalties.
  unit: text
  flag: ASSUMPTION
  source: "Desk SPA clause drafted from DGFT PN 46/2015-2020 (14-Jan-2022) conditions and ISRI 2022 Zorba spec ('Shall be free of radioactive material')"
  verify: "N/A — contract-design assumption; underlying DGFT condition PARTIAL (see regulatory.yaml import_policy_hs7602)"
  note: "Summary text only — not legal advice and not a copy of any real contract."

# ---------------------------------------------------------------------------------------------------------------
# Domestic sales credit norms (Table 4 row 2.6)
# ---------------------------------------------------------------------------------------------------------------
domestic_buyer_credit_days:
  value: 30
  unit: days
  flag: ASSUMPTION
  source: "MASTER_SPEC_V3 Table 4 row 2.6 ('advance vs 30d credit on domestic sales'); consistent with finance_days_* construction in logistics.yaml"
  verify: "N/A — desk policy assumption"
  note: "Foundry buyers in the Rajkot cluster (SIM) get 30 days against a credit limit; weak names pay advance. P2/P5 use this for exposure and days-past-due."

msme_max_payment_days:
  value: 45
  unit: days
  flag: DIRECT
  source: "Micro, Small and Medium Enterprises Development Act 2006, s.15 proviso: 'in no case the period agreed upon between the supplier and the buyer in writing shall exceed forty-five days from the day of acceptance or the day of deemed acceptance' (read at https://indiankanoon.org/doc/574789/ on 2026-09-16)"
  verify: "VERIFIED 2026-09-16 (statute text via Indian Kanoon; not re-checked on India Code)"
  note: "Relevant only where the supplier in a domestic sale is a registered micro/small enterprise (e.g. if the SIM desk were one selling to a large buyer): the statute caps agreed credit at 45 days. Interest consequences of late payment (s.16) were not re-read."

secondary_raw_material_cost_share:
  value: 0.825
  unit: frac_of_total_cost
  flag: PROXY
  source: "[CRISIL] Sept 2021: 'Raw material cost (scrap) typically accounts for 80-85% of the total cost (inclusive of all taxes and duties)'; the value is the midpoint of that published range (a transformation, hence PROXY; the DIRECT statement is the range 0.80–0.85)"
  verify: "VERIFIED 2026-09-16 that CRISIL Research publishes the 80–85% range (cached CMR PDF, industry estimate, not a measured 2022 figure); the midpoint is a convention"
  note: "Context for conversion_cost_inr_t and for the interview answer 'why is scrap spread, not LME, the P&L driver for a secondary smelter'. Same report: '85-90% of scrap is imported' (FY2020) and secondary aluminium 'continues to be 25-30% cheaper than primary aluminium'."

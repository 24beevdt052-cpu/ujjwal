# Owned by the Phase 0 regulatory/contract research agent. Exchange-contract and hedging conventions: MCX Aluminium,
# LME Aluminium reference prices, USD/INR forwards. Research trail: docs/research/regulatory_contract_notes.md §5–6.
#
# MCX sources (all read 2026-09-16 in a browser session — mcxindia.com returns Akamai HTTP 403 to scripted clients, and
# the "Aluminium April 2022 contracts onwards" specification PDF now serves an HTML page, so the spec was taken from the
# contract-launch circulars that embed it; PDF text extracted in-browser with pdf.js):
#   [C385] MCX/TRD/385/2021, 30-Jun-2021, Annexure 1 'Contract Specifications of Aluminium' (Nov-2021 contract)
#   https://www.mcxindia.com/docs/default-source/circulars/english/2021/june/circular-385---2021gu8e60c446-fadd-442b-96ff-40a27492ea5c.pdf
#   [C617] MCX/TRD/617/2022, 31-Oct-2022, Annexure 1 (Mar-2023 contract)
#   https://www.mcxindia.com/docs/default-source/circulars/english/2022/october/circular-617-2022gu7c8756af-e5c2-4c2e-b3c8-338419b706c2.pdf
#   [PR22] MCX Aluminium Performance Review 2021-22 and [PR23] 2022-23 (delivery tables list actual contract expiries)
#   https://www.mcxindia.com/docs/default-source/products/metals/performance-review/aluminium---performance-review-2021-22.pdf
#   https://www.mcxindia.com/docs/default-source/products/metals/performance-review/mcx_aluminium-performance-review-22-23.pdf
# Every 2022-traded contract (Mar–Nov 2022 expiries) was launched between these two circulars, whose Aluminium
# annexures are identical on every field below except the additional delivery centres — hence DIRECT for 2022.

# ---------------------------------------------------------------------------------------------------------------
# MCX Aluminium (symbol ALUMINIUM)
# ---------------------------------------------------------------------------------------------------------------

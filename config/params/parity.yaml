# Owned by Phase 1 (import parity model, desk.parity). Only keys the parity model needs that no Phase 0 file defines.
# Every CONTRACTS §5 line item still reads its canonical Phase 0 key; nothing here renames or replaces one.
# Methods page: docs/10_parity_model.md.

# ---------------------------------------------------------------------------------------------------------------
# Base-case modelling choices left open by CONTRACTS §5
# ---------------------------------------------------------------------------------------------------------------
parity_goods_fx_basis:
  value: usdinr_fwd_1m
  unit: panel_column_name
  flag: ASSUMPTION
  source: "CONTRACTS §5 goods_inr_t: 'market spot (P1 may use usdinr_fwd_* matched to the LC payment date instead, and must say which)'. Column from data/processed/market_daily.csv (PROXY, covered-interest-parity forward)."
  verify: "N/A — modelling choice; the spot alternative is published as sensitivity case goods_fx_spot"
  note: >-
    Goods are paid under a sight LC on document presentation, ~7 days after the B/L (logistics.yaml finance_days_*
    notes), and the B/L falls inside the 15-day shipment window (typical_laycan_days) after the parity week — so the
    USD payment is roughly one month after the decision on both lanes. An importer that fixes the rupee cost on the
    decision date buys USD one month forward; the domestic anchor is also a forward price (the MCX contract matched to
    the sale date), so both legs are valued at prices lockable on the same day. Pricing goods at spot would book the
    ~1-month forward premium (≈ INR 340–610/t of scrap in the Mar–Aug 2022 weeks) as margin. finance_inr_t then covers payment → buyer receipt
    only, so no time period is financed twice.

customs_fx_notification_validity_days:
  value: 14
  unit: calendar_days
  flag: ASSUMPTION
  source: "CBIC fortnightly exchange-rate notifications: consecutive USD-changing breakpoints in customs_usdinr_import (regulatory.yaml) are 14–21 days apart"
  verify: "N/A — coverage rule for dates outside the registered notifications"
  note: >-
    The registered notification path runs 18-Feb-2022 → 16-Sep-2022. A parity week whose value date is before the first
    notification, or more than this many days after the last one, uses customs_fx_markup_frac × market USD/INR (the
    register's documented fallback) instead of clamping a stale notified rate; parity_weekly.csv labels each row in
    customs_fx_src. Only out-of-window context weeks (Jan–mid-Feb and October 2022) are affected.

